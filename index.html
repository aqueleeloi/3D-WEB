<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eloi Silva | Balance Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F2F2F4; --text: #000; --accent: #FF4500; --wheel: #000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; background: var(--bg); font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; }

        header { text-align: center; width: 100%; }
        .buzz-text { font-size: 2.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; line-height: 1; margin-bottom: 10px; }
        
        .score-container {
            display: inline-flex; gap: 20px; background: #fff; padding: 10px 25px; 
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-weight: 900; font-size: 1rem;
        }
        #current-score { color: var(--accent); min-width: 40px; display: inline-block; }

        .stage { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 12px solid var(--wheel);
            position: relative; cursor: grab; z-index: 2;
        }
        .bar {
            position: absolute; width: 100px; height: 14px; background: var(--wheel);
            top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 20px;
        }
        .ball {
            position: absolute; width: 28px; height: 28px; background: var(--accent);
            border-radius: 50%; z-index: 5; pointer-events: none; will-change: transform;
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.3);
            transition: background 0.2s;
        }
        .ball.active { background: #ff7700; box-shadow: 0 0 20px rgba(255, 69, 0, 0.6); }

        .menu { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
        .card {
            background: #fff; padding: 15px 20px; border-radius: 14px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--text); font-weight: 600;
            border: 1px solid rgba(0,0,0,0.03);
        }
        footer { font-size: 0.7rem; color: #bbb; letter-spacing: 0.1em; }
    </style>
</head>
<body>

    <header>
        <h1 class="buzz-text">ELOI SILVA</h1>
        <div class="score-container">
            <span>TIME: <span id="current-score">0.0</span>s</span>
            <span>BEST: <span id="high-score">0.0</span>s</span>
        </div>
    </header>

    <div class="stage">
        <div class="wheel" id="wheel">
            <div class="bar"></div>
        </div>
        <div class="ball" id="ball"></div>
    </div>

    <nav class="menu">
        <a href="https://www.instagram.com/aquele.eloi" target="_blank" class="card">Instagram <span>→</span></a>
        <a href="https://www.behance.net/eloi_silva" target="_blank" class="card">Behance <span>→</span></a>
    </nav>

    <footer>PORTUGAL 2026</footer>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');
        const scoreEl = document.getElementById('current-score');
        const highscoreEl = document.getElementById('high-score');

        let wAngle = 0, wVel = 0, isDrag = false, lastA = 0;
        let bX = 0, bY = -100, bVX = 0, bVY = 0;
        let score = 0, highscore = 0;

        const GRAVITY = 0.35;
        const FRICTION = 0.98;
        const BOUNCE = 0.4;
        const RADIUS = 135; // Limite da roda
        const BAR_W = 50;   // Metade da largura (Total 100px)
        const BAR_H = 7;    // Metade da altura (Total 14px)
        const BALL_R = 14;

        function getMouseAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - cx;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - cy;
            return Math.atan2(y, x);
        }

        wheel.addEventListener('mousedown', (e) => { isDrag = true; lastA = getMouseAngle(e); });
        wheel.addEventListener('touchstart', (e) => { isDrag = true; lastA = getMouseAngle(e); }, {passive: false});
        
        window.addEventListener('mousemove', (e) => {
            if (!isDrag) return;
            const a = getMouseAngle(e);
            let diff = a - lastA;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            wVel = diff * (180 / Math.PI);
            wAngle += wVel;
            lastA = a;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDrag) return;
            const a = getMouseAngle(e);
            let diff = a - lastA;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            wVel = diff * (180 / Math.PI);
            wAngle += wVel;
            lastA = a;
        }, {passive: false});

        window.addEventListener('mouseup', () => isDrag = false);
        window.addEventListener('touchend', () => isDrag = false);

        function update() {
            if (!isDrag) { wVel *= 0.95; wAngle += wVel; }

            // Gravidade constante
            bVY += GRAVITY;
            bX += bVX; bY += bVY;

            // Coordenadas locais da barra
            const rad = -wAngle * (Math.PI / 180);
            const cos = Math.cos(rad), sin = Math.sin(rad);
            const lx = bX * cos - bY * sin;
            const ly = bX * sin + bY * cos;

            let isBalanced = false;

            // Colisão com o topo da barra
            if (ly > -(BAR_H + BALL_R) && ly < -BAR_H + 5 && Math.abs(lx) < BAR_W + 5) {
                if (bVY > 0) { // Só colide se estiver a cair
                    isBalanced = true;
                    
                    // Impedir que a bola atravesse a barra
                    const fixedY = -(BAR_H + BALL_R);
                    bX = lx * Math.cos(-rad) - fixedY * Math.sin(-rad);
                    bY = lx * Math.sin(-rad) + fixedY * Math.cos(-rad);

                    // Reação de equilíbrio: a inclinação da barra empurra a bola
                    const tilt = Math.sin(wAngle * Math.PI / 180);
                    bVX += tilt * 0.6; // Força de deslize
                    bVY *= -0.1; // Suaviza o impacto vertical
                    
                    // Inércia do movimento da mão
                    bVX += wVel * 0.05;
                }
            }

            // Lógica do Cronómetro
            if (isBalanced && Math.abs(lx) < BAR_W) {
                score += 0.016;
                ball.classList.add('active');
            } else {
                if (score > highscore) {
                    highscore = score;
                    highscoreEl.innerText = highscore.toFixed(1);
                }
                score = 0;
                ball.classList.remove('active');
            }
            scoreEl.innerText = score.toFixed(1);

            // Colisão com a Roda Exterior
            const dist = Math.sqrt(bX*bX + bY*bY);
            if (dist > RADIUS - BALL_R) {
                const nx = bX/dist, ny = bY/dist;
                bX = nx * (RADIUS - BALL_R); bY = ny * (RADIUS - BALL_R);
                const dot = bVX*nx + bVY*ny;
                bVX = (bVX - 2*dot*nx) * BOUNCE;
                bVY = (bVY - 2*dot*ny) * BOUNCE;
                // Impulso ao bater na borda girando
                bVX += -ny * wVel * 0.3;
                bVY += nx * wVel * 0.3;
            }

            bVX *= FRICTION; bVY *= FRICTION;

            ball.style.transform = `translate(${bX}px, ${bY}px)`;
            wheel.style.transform = `rotate(${wAngle}deg)`;

            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>

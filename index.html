<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg: #F0F0F2; /* Fundo Claro Original */
            --text: #050505;
            --white: #FFFFFF;
            --wheel-border: #000000;
            --ball-color: #FF4500;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; outline: none;
            -webkit-user-select: none; user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            height: 100dvh; width: 100%; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 40px 24px 30px 24px;
        }

        /* --- SISTEMA DE TITULO AURORA/BUZZ --- */
        header { 
            text-align: center; 
            z-index: 10; 
            pointer-events: none; 
            width: 100%;
            position: relative;
            height: 100px; /* Espaço reservado para o efeito */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contentor do título para alinhar as camadas */
        .title-wrapper {
            position: relative;
            display: inline-block;
        }

        /* Estilo Base do Texto */
        h1 {
            font-size: 3.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            line-height: 0.9;
            margin: 0;
            padding: 0;
            color: transparent; /* Oculta o texto base, mostraremos as camadas */
        }

        /* Camadas do Texto (Main, Red, Cyan) */
        .title-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            will-change: transform, filter, opacity;
        }

        /* Camada Principal (Preta e Nítida) */
        .layer-main {
            color: #000;
            z-index: 3;
            /* Pequena distorção (skew) baseada na velocidade */
            transform-origin: center bottom;
        }

        /* Camada de Efeito 1 (Vermelho/Magenta) */
        .layer-red {
            color: #FF0055;
            z-index: 2;
            opacity: 0.8;
            mix-blend-mode: multiply; /* Mistura realista no fundo claro */
        }

        /* Camada de Efeito 2 (Ciano/Azul) */
        .layer-cyan {
            color: #00CCFF;
            z-index: 1;
            opacity: 0.8;
            mix-blend-mode: multiply;
        }

        .badge {
            position: absolute;
            bottom: -20px; left: 50%; transform: translateX(-50%);
            display: inline-block; background: var(--white);
            border: 1px solid rgba(0,0,0,0.08); padding: 5px 16px; border-radius: 100px;
            font-size: 0.75rem; font-weight: 600; color: #888; letter-spacing: 0.05em;
        }

        /* --- STAGE --- */
        .stage {
            position: relative; width: 290px; height: 290px;
            display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }

        .static-shadow {
            position: absolute; width: 92%; height: 92%; border-radius: 50%;
            background: transparent; box-shadow: 0 30px 70px rgba(0,0,0,0.12);
            z-index: 0; pointer-events: none;
        }

        .wheel {
            position: relative; width: 100%; height: 100%;
            border-radius: 50%;
            border: 14px solid var(--wheel-border);
            cursor: grab; z-index: 2;
            transform: translateZ(0);
        }
        .wheel:active { cursor: grabbing; }

        /* OBSTÁCULO COM GLITCH */
        .obstacle {
            position: absolute;
            width: 24px; height: 24px;
            background-color: var(--wheel-border);
            top: 40px; left: 50%; margin-left: -12px;
            border-radius: 2px;
            transition: transform 0.05s;
            will-change: transform, box-shadow, filter;
        }

        /* BOLA SÓLIDA */
        .ball {
            position: absolute; width: 32px; height: 32px;
            background-color: var(--ball-color);
            border-radius: 50%; z-index: 5;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3), inset -2px -2px 6px rgba(0,0,0,0.2);
            top: 50%; left: 50%; margin-top: -16px; margin-left: -16px;
            pointer-events: none; will-change: transform;
        }

        /* LINKS */
        .menu { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .card {
            background: var(--white); padding: 18px 25px; border-radius: 18px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--text); font-weight: 600;
            transition: all 0.2s; border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .card-left { display: flex; align-items: center; gap: 14px; }
        .card-icon { width: 20px; height: 20px; fill: currentColor; }
        .card:active { transform: scale(0.97); background: #f9f9f9; }

        footer { font-size: 0.7rem; color: #BBB; text-transform: uppercase; letter-spacing: 0.1em; }
        #sound-hint { position: absolute; top: 120px; font-size: 0.6rem; color: #999; opacity: 0; }

    </style>
</head>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');
        const obstacle = document.getElementById('obstacle');
        
        // Elementos do Título
        const titleMain = document.getElementById('title-main');
        const titleRed = document.getElementById('title-red');
        const titleCyan = document.getElementById('title-cyan');

        // AUDIO
        let audioCtx = null;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const hint = document.getElementById('sound-hint');
            hint.style.opacity = 1; setTimeout(() => hint.style.opacity = 0, 3000);
        }
        function playRatchet(velocity) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const speed = Math.min(Math.abs(velocity), 50);
            osc.frequency.setValueAtTime(100 + (speed * 5), audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.type = 'triangle'; osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }
        function playClack() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
            osc.type = 'square'; osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        // --- EFEITO MOTION BLUR CROMÁTICO (BUZZ/AURORA STYLE) ---
        function updateAuroraEffect(velocity) {
            const speed = Math.abs(velocity);
            
            // Definições do Efeito
            // Quanto maior a velocidade, maior o offset e o blur
            // Multiplicadores ajustados para parecer a imagem
            const offset = Math.min(speed * 2.5, 40); // Separação horizontal
            const blur = Math.min(speed * 0.8, 12);   // Blur horizontal
            const skew = -velocity * 0.5;             // Distorção de velocidade

            if (offset > 0.5) {
                // Mover Red para a Esquerda
                titleRed.style.transform = `translateX(-${offset}px) skewX(${skew}deg)`;
                titleRed.style.filter = `blur(${blur}px)`;
                
                // Mover Cyan para a Direita
                titleCyan.style.transform = `translateX(${offset}px) skewX(${skew}deg)`;
                titleCyan.style.filter = `blur(${blur}px)`;
                
                // Manter o Main nítido, mas com skew
                titleMain.style.transform = `skewX(${skew}deg)`;
                
                // Ajustar opacidade para efeito de "rasto"
                const opacity = Math.min(0.8 + (speed * 0.01), 1);
                titleRed.style.opacity = opacity;
                titleCyan.style.opacity = opacity;

            } else {
                // Reset
                titleRed.style.transform = 'none';
                titleRed.style.filter = 'none';
                titleCyan.style.transform = 'none';
                titleCyan.style.filter = 'none';
                titleMain.style.transform = 'none';
            }
        }

        // --- GLITCH OBSTACULO ---
        let obsGlitchIntensity = 0;
        function applyObstacleGlitch(intensity) {
            const shift = Math.min(intensity * 0.8, 20);
            const blur = Math.min(intensity * 0.3, 6);
            if (shift > 1) {
                obstacle.style.backgroundColor = '#000';
                // Sombra de cor sólida (Hard light style)
                obstacle.style.boxShadow = `
                    ${shift}px 0 0 rgba(255, 0, 85, 0.8), 
                    -${shift}px 0 0 rgba(0, 204, 255, 0.8)
                `;
                obstacle.style.filter = `blur(${blur}px)`;
                obstacle.style.transform = `scale(1.2) rotate(${Math.random()*10 - 5}deg)`;
            } else {
                obstacle.style.boxShadow = 'none';
                obstacle.style.filter = 'none';
                if(!obstacle.classList.contains('hit')) obstacle.style.transform = 'none';
            }
        }

        // FÍSICA
        let wAngle = 0, isDrag = false, sAngle = 0, wVel = 0, lastTick = 0;
        let bX = 0, bY = 0, bVX = 0, bVY = 0;
        const GRAVITY = 0.45, FRICTION = 0.995, BOUNCE = 0.75;
        const LIMIT = 117; 
        const OBS_RADIUS = 105; 
        const OBS_HIT_RAD = 29; 

        function getA(x, y) {
            const r = wheel.getBoundingClientRect();
            return Math.atan2(y - (r.top + r.height/2), x - (r.left + r.width/2)) * 180 / Math.PI;
        }

        function start(e) {
            initAudio(); isDrag = true; wVel = 0;
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            sAngle = getA(cx, cy) - wAngle;
        }

        function move(e) {
            if (!isDrag) return;
            e.preventDefault();
            const cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            const a = getA(cx, cy);
            let d = (a - sAngle) - wAngle;
            if (d > 180) d -= 360; if (d < -180) d += 360;
            wVel = d; wAngle += d;
            wheel.style.transform = `rotate(${wAngle}deg)`;
            if (Math.abs(wAngle - lastTick) > 15) { playRatchet(wVel); lastTick = wAngle; }
        }

        function end() { isDrag = false; }

        function loop() {
            if (!isDrag) {
                wVel *= 0.985; wAngle += wVel;
                wheel.style.transform = `rotate(${wAngle}deg)`;
                if (Math.abs(wAngle - lastTick) > 15 && Math.abs(wVel) > 0.5) { playRatchet(wVel); lastTick = wAngle; }
            }
            
            // ATUALIZAR EFEITO DO TITULO
            updateAuroraEffect(wVel);

            // GLITCH OBSTACULO
            if (obsGlitchIntensity > 0) {
                applyObstacleGlitch(obsGlitchIntensity);
                obsGlitchIntensity *= 0.85; 
                if(obsGlitchIntensity < 1) obsGlitchIntensity = 0;
            } else {
                obstacle.style.boxShadow = 'none';
                obstacle.style.filter = 'none';
                obstacle.style.transform = 'none';
            }

            // BOLA
            bVY += GRAVITY; bX += bVX; bY += bVY;

            const rad = (wAngle - 90) * (Math.PI / 180);
            const obsX = Math.cos(rad) * OBS_RADIUS;
            const obsY = Math.sin(rad) * OBS_RADIUS;
            const dx = bX - obsX;
            const dy = bY - obsY;
            const distObs = Math.sqrt(dx*dx + dy*dy);

            if (distObs < OBS_HIT_RAD) {
                const nx = dx / distObs; const ny = dy / distObs;
                const overlap = OBS_HIT_RAD - distObs;
                bX += nx * overlap; bY += ny * overlap; 
                const dot = bVX * nx + bVY * ny;
                bVX -= 2 * dot * nx; bVY -= 2 * dot * ny;
                const spinForce = wVel * 1.5;
                bVX += -ny * spinForce; bVY += nx * spinForce;

                playClack();
                const impactForce = Math.sqrt(bVX*bVX + bVY*bVY) + Math.abs(spinForce);
                obsGlitchIntensity = Math.min(impactForce * 3, 40);
            }

            const d = Math.sqrt(bX*bX + bY*bY);
            if (d > LIMIT) {
                const nx = bX/d, ny = bY/d;
                bX = nx*LIMIT; bY = ny*LIMIT;
                const dot = bVX*nx + bVY*ny;
                bVX -= 2*dot*nx; bVY -= 2*dot*ny;
                bVX *= BOUNCE; bVY *= BOUNCE;
                const s = wVel * 1.2; bVX += -ny*s; bVY += nx*s;
            }
            bVX *= FRICTION; bVY *= FRICTION;
            ball.style.transform = `translate3d(${bX}px, ${bY}px, 0)`;

            requestAnimationFrame(loop);
        }

        const p = {passive: false};
        wheel.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        wheel.addEventListener('touchstart', start, p);
        window.addEventListener('touchmove', move, p);
        window.addEventListener('touchend', end);

        bY = 50; loop();
    </script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eloi Silva | Visual Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #F2F2F4;       
            --text: #000000;
            --white: #FFFFFF;
            --wheel-border: #000000;
            --ball-color: #FF4500; 
        }

        /* --- RESET --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 50px 24px 40px 24px; 
        }

        /* --- CABEÇALHO --- */
        header { 
            text-align: center; z-index: 10; pointer-events: none; width: 100%;
            height: 120px; 
            display: flex; align-items: center; justify-content: center;
            position: relative;
            margin-top: -30px; 
        }

        .buzz-wrapper {
            position: relative;
            display: grid; 
            place-items: center;
            isolation: isolate; 
        }

        /* Tipografia */
        .buzz-text {
            font-size: 3.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            line-height: 1;
            margin: 0;
            white-space: nowrap;
            /* Transição suave para voltar ao normal quando para */
            transition: transform 0.1s, filter 0.1s;
            will-change: transform, filter;
            grid-area: 1 / 1; 
        }

        .buzz-spacer {
            font-size: 3.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; line-height: 1;
            visibility: hidden; opacity: 0; pointer-events: none;
        }

        /* --- CAMADAS DO EFEITO --- */
        .layer-main { color: #000000; z-index: 20; position: absolute; }
        
        .layer-cyan {
            color: #00FFFF; mix-blend-mode: multiply; z-index: 5; position: absolute; opacity: 0.9;
        }
        .layer-magenta {
            color: #FF00FF; mix-blend-mode: multiply; z-index: 6; position: absolute; opacity: 0.9;
        }
        .layer-yellow {
            color: #FFFF00; mix-blend-mode: multiply; z-index: 4; position: absolute; opacity: 0.8;
        }

        .badge {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            display: inline-block; background: var(--white);
            border: 1px solid rgba(0,0,0,0.06); padding: 6px 16px; border-radius: 100px;
            font-size: 0.7rem; font-weight: 600; color: #666; letter-spacing: 0.05em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        /* --- STAGE --- */
        .stage { position: relative; width: 290px; height: 290px; display: flex; align-items: center; justify-content: center; touch-action: none; }
        
        .static-shadow { position: absolute; width: 92%; height: 92%; border-radius: 50%; background: transparent; box-shadow: 0 30px 70px rgba(0,0,0,0.12); z-index: 0; pointer-events: none; }

        .wheel {
            position: relative; width: 100%; height: 100%; border-radius: 50%;
            border: 14px solid var(--wheel-border); cursor: grab; z-index: 2; transform: translateZ(0);
            background: rgba(255,255,255,0.01);
        }
        .wheel:active { cursor: grabbing; }

        .arrow-marker {
            position: absolute; width: 0; height: 0;
            border-left: 7px solid transparent; border-right: 7px solid transparent;
            border-bottom: 12px solid var(--wheel-border);
            left: 50%; top: 2px; transform: translateX(-50%); pointer-events: none;
        }

        .ball {
            position: absolute; width: 32px; height: 32px; background-color: var(--ball-color);
            border-radius: 50%; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            top: 50%; left: 50%; margin-top: -16px; margin-left: -16px;
            pointer-events: none; will-change: transform;
        }

        /* --- LINKS --- */
        .menu { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .card {
            background: var(--white); padding: 18px 25px; border-radius: 16px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--text); font-weight: 600;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 2px 5px rgba(0,0,0,0.02); cursor: pointer;
        }
        .card-left { display: flex; align-items: center; gap: 14px; }
        .card-icon { width: 22px; height: 22px; fill: currentColor; }
        .card:active { transform: scale(0.97); background: #f5f5f5; }
        @media(hover: hover) { .card:hover { background: var(--text); color: var(--white); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); } }

        footer { font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 10px; }
        #sound-hint { position: absolute; top: 130px; font-size: 0.65rem; color: #BBB; opacity: 0; transition: opacity 1s; }

    </style>
</head>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');
        
        const txtCyan = document.getElementById('txt-cyan');
        const txtMagenta = document.getElementById('txt-magenta');
        const txtYellow = document.getElementById('txt-yellow');
        const txtMain = document.getElementById('txt-main');

        // AUDIO
        let audioCtx = null;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('sound-hint').style.opacity = 1;
            setTimeout(() => document.getElementById('sound-hint').style.opacity = 0, 3000);
        }
        function playTick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.type = 'triangle'; osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        }

        // --- EFEITO REATIVO: VELOCIDADE + POSIÇÃO ---
        function updateGlitchEffect(ballX, ballY, velocity) {
            const speed = Math.abs(velocity);
            
            // CONDIÇÃO DE PARAGEM: Se a velocidade for muito baixa, RESET
            if (speed < 0.5) {
                const reset = 'translate(0,0)';
                txtCyan.style.transform = reset; txtCyan.style.filter = 'none';
                txtMagenta.style.transform = reset; txtMagenta.style.filter = 'none';
                txtYellow.style.transform = reset; txtYellow.style.filter = 'none';
                return; // Sai da função, mantendo tudo limpo
            }

            // --- SE ESTIVER A RODAR ---
            
            // 1. Normalizar posição da bola (-1 a 1) para saber a DIREÇÃO
            const ratioX = ballX / 117; 
            const ratioY = ballY / 117; 
            
            // 2. Definir intensidade baseada EXCLUSIVAMENTE na VELOCIDADE
            // Quanto mais rápido, maior o efeito
            const shiftIntensity = Math.min(speed * 1.5, 40); // Max 40px
            const blurIntensity = Math.min(speed * 0.4, 8);   // Max 8px

            // 3. Calcular deslocamento final (Direção * Intensidade)
            const shiftX = ratioX * shiftIntensity;
            const shiftY = ratioY * shiftIntensity;

            // 4. Aplicar às camadas
            // Ciano segue a bola
            txtCyan.style.transform = `translate(${shiftX}px, ${shiftY}px)`;
            txtCyan.style.filter = `blur(${blurIntensity}px)`;
            
            // Magenta vai ao contrário (para criar o split RGB)
            txtMagenta.style.transform = `translate(${-shiftX}px, ${-shiftY}px)`;
            txtMagenta.style.filter = `blur(${blurIntensity}px)`;
            
            // Amarelo fica no meio com um pouco de escala
            txtYellow.style.transform = `translate(${shiftX*0.2}px, ${shiftY*0.2}px) scale(${1 + speed/200})`;
            txtYellow.style.filter = `blur(${blurIntensity * 1.5}px)`;
        }

        // FÍSICA
        let wAngle = 0, isDrag = false, sAngle = 0, wVel = 0, lastTick = 0;
        let bX = 0, bY = 0, bVX = 0, bVY = 0;
        const GRAVITY = 0.45, FRICTION = 0.995, BOUNCE = 0.65;
        const LIMIT = 117; 

        function getA(x, y) {
            const r = wheel.getBoundingClientRect();
            return Math.atan2(y - (r.top + r.height/2), x - (r.left + r.width/2)) * 180 / Math.PI;
        }

        function start(e) {
            initAudio(); isDrag = true; wVel = 0;
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            sAngle = getA(cx, cy) - wAngle;
            wheel.style.cursor = 'grabbing';
        }

        function move(e) {
            if (!isDrag) return;
            e.preventDefault();
            const cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            const a = getA(cx, cy);
            let d = (a - sAngle) - wAngle;
            if (d > 180) d -= 360; if (d < -180) d += 360;
            wVel = d; wAngle += d;
            wheel.style.transform = `rotate(${wAngle}deg)`;
            if (Math.abs(wAngle - lastTick) > 30) { playTick(); lastTick = wAngle; }
        }

        function end() { isDrag = false; wheel.style.cursor = 'grab'; }

        function loop() {
            if (!isDrag) {
                wVel *= 0.985; wAngle += wVel;
                wheel.style.transform = `rotate(${wAngle}deg)`;
                if (Math.abs(wAngle - lastTick) > 30 && Math.abs(wVel) > 0.5) { playTick(); lastTick = wAngle; }
            }
            
            // FÍSICA BOLA
            bVY += GRAVITY; bX += bVX; bY += bVY;
            const d = Math.sqrt(bX*bX + bY*bY);
            if (d > LIMIT) {
                const nx = bX/d, ny = bY/d;
                bX = nx*LIMIT; bY = ny*LIMIT;
                const dot = bVX*nx + bVY*ny;
                bVX -= 2*dot*nx; bVY -= 2*dot*ny;
                bVX *= BOUNCE; bVY *= BOUNCE;
                const s = wVel * 1.2; bVX += -ny*s; bVY += nx*s;
            }
            bVX *= FRICTION; bVY *= FRICTION;
            ball.style.transform = `translate3d(${bX}px, ${bY}px, 0)`;

            // ATUALIZAR EFEITO DO TÍTULO (Depois de calcular a posição da bola)
            updateGlitchEffect(bX, bY, wVel);

            requestAnimationFrame(loop);
        }

        const p = {passive: false};
        wheel.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        wheel.addEventListener('touchstart', start, p);
        window.addEventListener('touchmove', move, p);
        window.addEventListener('touchend', end);

        bY = 50; loop();
    </script>

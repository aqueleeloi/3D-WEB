<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eloi Silva | Links</title>
    <style>
        /* --- CONFIGURAÇÕES GERAIS E VARIÁVEIS --- */
        :root {
            --bg-color: #f2f2f7;
            --card-white: #ffffff;
            --card-black: #111111;
            --accent-color: #d64933; /* O laranja da imagem */
            --text-main: #111111;
            --text-muted: #8e8e93;
            --radius-phone: 40px;
            --radius-card: 24px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e0e0e0; /* Fundo fora do telemóvel */
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* --- O CONTENTOR "TELEMÓVEL" --- */
        .phone-wrapper {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 400px; /* Largura típica de telemóvel */
            min-height: 100vh;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 0 24px 24px 24px;
        }

        /* Ajuste para parecer um telemóvel em ecrãs grandes */
        @media (min-width: 450px) {
            .phone-wrapper {
                min-height: 850px;
                height: 850px;
                border-radius: var(--radius-phone);
                border: 8px solid #333;
                margin: 20px;
            }
        }

        /* --- CABEÇALHO (STATUS BAR) --- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            padding-bottom: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        
        /* --- HEADER COM DATA E NOME --- */
        .header-section {
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .header-date {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* --- O "DIAL" (Elemento visual da esquerda) --- */
        /* Recriando o botão redondo preto da imagem como elemento de destaque */
        .dial-container {
            display: flex;
            justify-content: center;
            margin: 20px 0 40px 0;
            position: relative;
            perspective: 1000px;
        }

        .dial {
            width: 160px;
            height: 160px;
            background-color: var(--card-black);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        /* O ponto branco no dial */
        .dial::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: white;
            border-radius: 50%;
            bottom: 25px;
            left: 35px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dial:hover::after {
            transform:  translate(60px, -10px); /* Animação do ponto */
        }

        .dial:active {
            transform: scale(0.95);
        }

        .dial-text {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            opacity: 0.7;
        }

        .dial-icon {
            font-size: 30px;
        }

        /* Marcadores laterais do dial */
        .dial-ticks {
            position: absolute;
            bottom: 10px;
            width: 180px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            color: var(--text-main);
            font-weight: bold;
            font-size: 12px;
        }

        /* --- GRELHA DE LINKS (TILT 3D) --- */
        .grid-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
        }

        .card {
            border-radius: var(--radius-card);
            padding: 24px;
            text-decoration: none;
            transition: all 0.1s ease; /* Transição rápida para o efeito tilt */
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            /* Efeito de entrada */
            opacity: 0;
            animation: slideUp 0.6s ease-out forwards;
        }

        /* Card Grande Preto (Destaque) */
        .card.dark {
            background-color: var(--card-black);
            color: white;
            height: 140px;
            animation-delay: 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Cards Brancos */
        .card.light {
            background-color: var(--card-white);
            color: var(--text-main);
            height: 100px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .card.light:nth-child(2) { animation-delay: 0.3s; }
        .card.light:nth-child(3) { animation-delay: 0.4s; }

        /* Tipografia dos Cards */
        .card-label {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        
        .card-title {
            font-size: 22px;
            font-weight: 600;
        }

        .card-icon {
            font-size: 28px;
        }

        /* Flecha no card */
        .arrow-icon {
            margin-left: auto;
            font-size: 20px;
        }

        /* --- BOTÃO FLUTUANTE INFERIOR (Footer) --- */
        .bottom-nav {
            margin-top: 20px;
            background-color: var(--card-black);
            border-radius: 40px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .nav-pill {
            background-color: var(--card-white);
            color: var(--card-black);
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
        }

        .nav-text {
            color: white;
            font-weight: 600;
            margin-right: 30px;
            font-size: 14px;
        }

        /* --- ANIMAÇÕES --- */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Efeito de Brilho (Glare) no Tilt */
        .glare {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: linear-gradient(125deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 40%);
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="phone-wrapper">
        
        <div class="status-bar">
            <span id="clock">9:41</span>
            <span>
                <span style="letter-spacing: -2px;">IIII</span> &nbsp; 5G
            </span>
        </div>

        <div class="header-section">
            <div class="header-date" id="full-date">Monday<br>28 May</div>
            <div class="header-subtitle">Bem-vindo ao meu espaço</div>
        </div>

        <div class="dial-container">
            <div class="dial" id="interactive-dial">
                <div class="dial-icon">👋</div>
                <div class="dial-text">Conectar</div>
            </div>
            <div class="dial-ticks">
                <span>Start</span>
                <span>Max</span>
            </div>
        </div>

        <div class="grid-links">
            
            <a href="https://www.instagram.com/aquele.eloi" target="_blank" class="card dark js-tilt">
                <div>
                    <div class="card-label">Social Media</div>
                    <div class="card-title">Instagram</div>
                </div>
                <div class="card-icon">📸</div>
                <div class="glare"></div>
            </a>

            <a href="https://www.behance.net/eloi_silva" target="_blank" class="card light js-tilt">
                <div>
                    <div class="card-title">Behance</div>
                    <div class="card-label" style="color: var(--accent-color)">Portfolio & Design</div>
                </div>
                <div class="arrow-icon">➔</div>
            </a>

            <a href="https://api.whatsapp.com/send/?phone=351913525033&text=Ol%C3%A1&type=phone_number&app_absent=0" target="_blank" class="card light js-tilt">
                <div>
                    <div class="card-title">WhatsApp</div>
                    <div class="card-label">Falar agora</div>
                </div>
                <div class="arrow-icon">➔</div>
            </a>

        </div>

        <div class="bottom-nav">
            <div class="nav-pill">Home</div>
            <div class="nav-text">Aquele Eloi ©</div>
        </div>

    </div>

    <script>
        // 1. Relógio e Data em Tempo Real
        function updateTime() {
            const now = new Date();
            
            // Hora (ex: 9:41)
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            // Data (ex: Monday, 28 May) - Adaptado para PT se preferires
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            // Podes mudar 'en-GB' para 'pt-PT' se quiseres a data em português
            const dateString = now.toLocaleDateString('pt-PT', options); 
            
            // Formatando para quebrar linha como na imagem
            const splitDate = dateString.split(',');
            if(splitDate.length > 1) {
                 document.getElementById('full-date').innerHTML = `${splitDate[0]}<br>${splitDate[1]}`;
            } else {
                document.getElementById('full-date').textContent = dateString;
            }
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 2. Efeito TILT 3D (Vanilla JS - Sem bibliotecas externas)
        // Faz os cartões mexerem quando passas o rato ou tocas
        const cards = document.querySelectorAll('.js-tilt');

        cards.forEach(card => {
            card.addEventListener('mousemove', handleMove);
            card.addEventListener('mouseleave', handleLeave);
            // Para mobile (touch)
            card.addEventListener('touchmove', handleMove);
            card.addEventListener('touchend', handleLeave);
        });

        function handleMove(e) {
            e.preventDefault(); // Previne scroll ao tocar nos cards
            
            const card = this;
            const height = card.clientHeight;
            const width = card.clientWidth;

            // Detectar se é touch ou mouse
            const xVal = e.layerX || (e.touches ? e.touches[0].clientX - card.getBoundingClientRect().left : 0);
            const yVal = e.layerY || (e.touches ? e.touches[0].clientY - card.getBoundingClientRect().top : 0);

            const yRotation = 20 * ((xVal - width / 2) / width);
            const xRotation = -20 * ((yVal - height / 2) / height);

            const string = `perspective(500px) scale(1.02) rotateX(${xRotation}deg) rotateY(${yRotation}deg)`;
            
            card.style.transform = string;
        }

        function handleLeave() {
            this.style.transform = `perspective(500px) scale(1) rotateX(0) rotateY(0)`;
        }

        // 3. Animação simples do Dial ao clicar
        const dial = document.getElementById('interactive-dial');
        dial.addEventListener('click', () => {
            dial.style.transform = "rotate(180deg)";
            setTimeout(() => {
                 dial.style.transform = "rotate(0deg)";
            }, 500);
        });

    </script>
</body>
</html>

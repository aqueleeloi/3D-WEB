    <style>
        :root {
            --bg: #EAEAEA;
            --text: #111111;
            --white: #FFFFFF;
            --wheel: #0a0a0a;
            --inner-track: #2a2a2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            height: 100dvh;
            width: 100%;
            overflow: hidden; /* Zero scroll */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            user-select: none;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            z-index: 10;
            pointer-events: none; /* Deixa clicar através se necessário */
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 1;
        }

        .role-badge {
            margin-top: 8px;
            display: inline-block;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.5);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        /* --- O PALCO DA FÍSICA --- */
        .physics-stage {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Responsividade para ecrãs pequenos */
        @media (max-width: 360px) {
            .physics-stage { width: 260px; height: 260px; }
        }

        /* 1. A Roda Grande (Gira com o user) */
        .wheel-container {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--wheel);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        
        .wheel-container:active { cursor: grabbing; }

        /* Marcadores visuais na roda para ver que ela gira */
        .wheel-marker {
            position: absolute;
            width: 4px;
            height: 15px;
            background: rgba(255,255,255,0.2);
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }
        .wheel-marker.bottom { top: auto; bottom: 10px; }
        .wheel-marker.left { top: 50%; left: 10px; transform: translateY(-50%) rotate(90deg); }
        .wheel-marker.right { top: 50%; left: auto; right: 10px; transform: translateY(-50%) rotate(90deg); }

        /* 2. A "Bola do Meio" (O buraco/pista) */
        /* Esta parte é visual, gira com a roda grande */
        .inner-hollow {
            width: 180px;
            height: 180px;
            background-color: var(--inner-track);
            border-radius: 50%;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5); /* Sombra interna para profundidade */
            position: relative;
        }

        /* 3. A BOLA SOLTA (PHYSICS BALL) */
        /* Importante: Esta bola NÃO está dentro do HTML da roda que gira.
           Ela é "irmã" para podermos controlar a posição X/Y independentemente da rotação da roda. */
        .physics-ball {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: var(--white);
            border-radius: 50%;
            z-index: 10; /* Fica por cima de tudo */
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            pointer-events: none; /* O rato passa por ela e agarra a roda */
            /* A posição será controlada via JS (Translate) */
            top: 50%; 
            left: 50%;
            margin-top: -15px; /* Metade da altura para centrar o 0,0 */
            margin-left: -15px;
        }

        /* --- LINKS --- */
        .menu {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .link-card {
            background: var(--white);
            padding: 16px 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .link-info { display: flex; align-items: center; gap: 12px; font-weight: 600; }
        .link-icon { width: 20px; height: 20px; fill: var(--text); }
        .link-arrow { opacity: 0.3; transition: 0.2s; }

        .link-card:active { transform: scale(0.95); }
        @media(hover: hover) {
            .link-card:hover { transform: scale(1.02); background: #111; color: #FFF; }
            .link-card:hover .link-icon { fill: #FFF; }
            .link-card:hover .link-arrow { opacity: 1; fill: #FFF; transform: translateX(5px); }
        }

        footer {
            font-size: 0.7rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 20px;
        }

    </style>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');

        // --- Variáveis da Roda (User Input) ---
        let wheelAngle = 0;
        let isDragging = false;
        let startAngle = 0;
        let wheelVelocity = 0; // Velocidade angular da roda
        let lastTimestamp = 0;

        // --- Variáveis da Bola (Physics) ---
        let ballX = 0; // Posição relativa ao centro (0,0 é o centro da roda)
        let ballY = 0; 
        let ballVX = 0; // Velocidade X
        let ballVY = 0; // Velocidade Y
        
        // Configurações Físicas
        const gravity = 0.5; // Força da gravidade para baixo
        const friction = 0.98; // Atrito do ar (bola desacelera)
        const bounce = 0.6; // O quanto a bola salta (0 a 1)
        const trackRadius = 90; // Raio da área interna (metade de 180px)
        const ballRadius = 15; // Raio da bola (metade de 30px)
        const boundary = trackRadius - ballRadius; // Limite de colisão
        
        // --- 1. LÓGICA DE ARRASTAR A RODA (INPUT) ---
        function getAngle(x, y) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
        }

        function startDrag(e) {
            isDragging = true;
            wheelVelocity = 0;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startAngle = getAngle(clientX, clientY) - wheelAngle;
            wheel.style.cursor = 'grabbing';
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            const angle = getAngle(clientX, clientY);
            
            const newAngle = angle - startAngle;
            let delta = newAngle - wheelAngle;
            
            // Correção matemática circular (evitar salto 360)
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;

            wheelVelocity = delta; // A velocidade é o quanto movemos
            wheelAngle = newAngle;
            
            wheel.style.transform = `rotate(${wheelAngle}deg)`;
        }

        function stopDrag() {
            isDragging = false;
            wheel.style.cursor = 'grab';
        }

        // --- 2. LOOP DE FÍSICA (GAME LOOP) ---
        function updatePhysics() {
            // A. Inércia da Roda
            if (!isDragging) {
                wheelVelocity *= 0.98; // Roda desacelera sozinha
                if (Math.abs(wheelVelocity) < 0.01) wheelVelocity = 0;
                wheelAngle += wheelVelocity;
                wheel.style.transform = `rotate(${wheelAngle}deg)`;
            }

            // B. Física da Bola
            // 1. Aplicar Gravidade
            ballVY += gravity;

            // 2. Aplicar Velocidade Atual
            ballX += ballVX;
            ballY += ballVY;

            // 3. Detetar Colisão com a Parede Circular (O Momento Mágico)
            // Calcular distância do centro
            const dist = Math.sqrt(ballX * ballX + ballY * ballY);

            if (dist > boundary) {
                // A bola bateu na parede!
                
                // Vetor Normal (direção do centro para a bola)
                const nx = ballX / dist;
                const ny = ballY / dist;

                // Reposicionar a bola na borda (para não atravessar)
                ballX = nx * boundary;
                ballY = ny * boundary;

                // Refletir Velocidade (Bounce)
                // Produto escalar da velocidade com a normal
                const dot = ballVX * nx + ballVY * ny;
                
                ballVX -= 2 * dot * nx;
                ballVY -= 2 * dot * ny;

                // Aplicar perda de energia (bounciness)
                ballVX *= bounce;
                ballVY *= bounce;

                // --- A PARTE GENIAL: TRANSFERÊNCIA DE ENERGIA DA RODA ---
                // Se a roda está a girar, ela "chuta" a bola na direção da tangente.
                // Tangente (-ny, nx)
                const spinForce = wheelVelocity * 0.8; // Ajustar força
                
                ballVX += -ny * spinForce; 
                ballVY += nx * spinForce;

                // Feedback Haptico se bater forte
                if (Math.abs(spinForce) > 2 && navigator.vibrate) {
                    navigator.vibrate(5);
                }
            }

            // 4. Atrito da Bola (para não rolar para sempre)
            ballVX *= friction;
            ballVY *= friction;

            // 5. Renderizar Bola
            // Translate3d para performance de GPU
            ball.style.transform = `translate3d(${ballX}px, ${ballY}px, 0)`;

            requestAnimationFrame(updatePhysics);
        }

        // --- LISTENERS ---
        wheel.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);
        wheel.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('touchend', stopDrag);

        // Iniciar
        updatePhysics();
        
        // Dar um empurrão inicial na bola para ela cair
        ballX = 10; 
        ballY = -50; 

    </script>

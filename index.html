    <style>
        :root {
            --bg: #F4F4F6;
            --text: #0A0A0A;
            --white: #FFFFFF;
            --accent: #FF3B30; /* Vermelho apenas para detalhes minimos */
            --wheel-base: #111111;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            height: 100dvh; /* Garante que ocupa 100% do ecrã móvel real */
            width: 100%;
            overflow: hidden; /* Proíbe scroll */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px 10px 20px;
        }

        /* --- CABEÇALHO COMPACTO --- */
        header {
            text-align: center;
            flex-shrink: 0;
            z-index: 10;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 8px;
        }

        .meta-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        /* O Badge Moderno (Clean) */
        .badge-exp {
            border: 1px solid rgba(0,0,0,0.15);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--text);
            font-weight: 600;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
        }

        /* --- A RODA (FIDGET SPINNER) --- */
        .spinner-wrapper {
            flex-grow: 1; /* Ocupa todo o espaço disponível no meio */
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            position: relative;
        }

        .wheel-container {
            position: relative;
            width: 260px; /* Tamanho base */
            height: 260px;
        }

        /* Ajuste responsivo para ecrãs pequenos */
        @media (max-height: 700px) {
            .wheel-container { width: 200px; height: 200px; }
            h1 { font-size: 1.8rem; }
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--wheel-base);
            position: relative;
            cursor: grab;
            /* Sombra suave para profundidade */
            box-shadow: 0 20px 60px rgba(0,0,0,0.15), inset 0 0 0 2px rgba(255,255,255,0.1);
            transition: transform 0.05s linear; /* Atualização ultra-rápida JS */
        }

        .wheel:active { cursor: grabbing; }

        /* O Indicador (Ponto) */
        .wheel-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            pointer-events: none;
        }

        /* --- LINKS (BOTTOM SHEET STYLE) --- */
        .links-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
            flex-shrink: 0;
            z-index: 10;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--white);
            padding: 18px 24px;
            border-radius: 18px;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-svg {
            width: 24px;
            height: 24px;
            fill: var(--text);
            transition: fill 0.2s;
        }

        .link-label {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        .link-arrow {
            opacity: 0.3;
            transition: all 0.2s;
        }

        /* Hover Interactions */
        .link-item:hover {
            transform: scale(1.02);
            background: var(--text);
            color: var(--white);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .link-item:hover .icon-svg { fill: var(--white); }
        .link-item:hover .link-arrow { opacity: 1; transform: translateX(4px); fill: var(--white); }

        /* Status flutuante minúsculo */
        .footer-status {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #999;
            text-align: center;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .status-dot { width: 6px; height: 6px; background: #00D26A; border-radius: 50%; }

    </style>
</head>

    <script>
        const wheel = document.getElementById('fidget-wheel');
        let currentAngle = 0;
        let isDragging = false;
        let startAngle = 0;
        let velocity = 0;
        let animationFrame;
        
        // Configuração de cores (Aquecer ao rodar)
        // De Preto (111111) para Laranja Quente (FF4500)
        function updateColor(vel) {
            // Normalizar a velocidade (max speed visual ~50)
            const speed = Math.min(Math.abs(vel), 50);
            const intensity = speed / 50; // 0 a 1

            // Se rodar muito rápido, vibra (Haptic Feedback)
            if (intensity > 0.8 && navigator.vibrate) {
                // Vibração muito curta e suave para não chatear
                navigator.vibrate(5);
            }

            if (intensity < 0.1) {
                wheel.style.backgroundColor = '#111111'; // Preto base
            } else {
                // Interpolar cor: Começa preto, vai aquecendo para vermelho/laranja
                // HSL é melhor para isso. Preto é L=0, Cor é L=50
                const lightness = intensity * 50; // Vai até 50%
                const hue = 10 + (30 * (1 - intensity)); // 40 (Laranja) -> 10 (Vermelho escuro)
                
                // Cor "Quente"
                wheel.style.backgroundColor = `hsl(${hue}, 100%, ${Math.max(7, lightness)}%)`;
                
                // Brilho externo (Glow)
                wheel.style.boxShadow = `0 20px 60px rgba(0,0,0,0.2), 0 0 ${intensity * 30}px rgba(255, 69, 0, ${intensity * 0.6})`;
            }
        }

        // Matemática de ângulos
        function getAngle(x, y) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
        }

        function startDrag(e) {
            isDragging = true;
            velocity = 0;
            cancelAnimationFrame(animationFrame);
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startAngle = getAngle(clientX, clientY) - currentAngle;
            wheel.style.cursor = 'grabbing';
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            const angle = getAngle(clientX, clientY);
            const newAngle = angle - startAngle;
            
            // Calcular velocidade instantânea
            let delta = newAngle - currentAngle;
            // Correção para quando passa de 360 para 0
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;

            velocity = delta;
            currentAngle = newAngle;
            
            wheel.style.transform = `rotate(${currentAngle}deg)`;
            updateColor(velocity);
        }

        function stopDrag() {
            isDragging = false;
            wheel.style.cursor = 'grab';
            requestAnimationFrame(inertiaLoop);
        }

        function inertiaLoop() {
            if (isDragging) return;

            // Fricção muito baixa para durar muito (0.985)
            velocity *= 0.985;

            if (Math.abs(velocity) < 0.05) {
                velocity = 0;
                updateColor(0); // Volta ao preto
                return;
            }

            currentAngle += velocity;
            wheel.style.transform = `rotate(${currentAngle}deg)`;
            updateColor(velocity);
            
            requestAnimationFrame(inertiaLoop);
        }

        // Event Listeners
        wheel.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        wheel.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('touchend', stopDrag);

        // Impulso inicial automático para demonstrar
        setTimeout(() => {
            velocity = 40; // Começa a girar rápido
            inertiaLoop();
        }, 800);

    </script>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eloi Silva | Balance Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #F2F2F4; --text: #000000; --white: #FFFFFF;
            --wheel-border: #000000; --ball-color: #FF4500; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; background: var(--bg); font-family: 'Inter', sans-serif; }

        body { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 30px 20px; }

        /* HEADER MAIS COMPACTO */
        header { text-align: center; z-index: 10; width: 100%; position: relative; }
        .buzz-wrapper { position: relative; height: 60px; display: grid; place-items: center; }
        .buzz-text {
            font-size: 2.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; position: absolute;
            transition: transform 0.1s; will-change: transform;
        }
        .layer-main { color: #000; z-index: 5; }
        .layer-cyan { color: #0FF; mix-blend-mode: multiply; opacity: 0.8; }
        .layer-magenta { color: #F0F; mix-blend-mode: multiply; opacity: 0.8; }

        /* SCORE */
        .score-container {
            margin: 15px 0; font-weight: 900; font-size: 0.9rem; display: flex; gap: 20px;
            background: #fff; padding: 8px 20px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        #current-score { color: var(--ball-color); }

        /* ÁREA DO JOGO */
        .stage { position: relative; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; }
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 12px solid var(--wheel-border);
            position: relative; cursor: grab; z-index: 2; transition: border-color 0.3s;
        }
        .wheel.scoring { border-color: var(--ball-color); }

        .bar {
            position: absolute; width: 140px; height: 16px; background: var(--wheel-border);
            top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 20px;
        }

        .ball {
            position: absolute; width: 28px; height: 28px; background: var(--ball-color);
            border-radius: 50%; z-index: 5; pointer-events: none; will-change: transform;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* LINKS */
        .menu { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 8px; }
        .card {
            background: var(--white); padding: 14px 20px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--text); font-weight: 600; font-size: 0.9rem;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .card:active { transform: scale(0.98); background: #eee; }

        footer { font-size: 0.6rem; color: #bbb; letter-spacing: 0.1em; }
    </style>
</head>
<body>

    <header>
        <div class="buzz-wrapper">
            <h1 class="buzz-text layer-cyan" id="txt-cyan">ELOI SILVA</h1>
            <h1 class="buzz-text layer-magenta" id="txt-magenta">ELOI SILVA</h1>
            <h1 class="buzz-text layer-main" id="txt-main">ELOI SILVA</h1>
        </div>
        <div class="score-container">
            <span>TIME: <span id="current-score">0.0</span>s</span>
            <span>BEST: <span id="high-score">0.0</span>s</span>
        </div>
    </header>

    <div class="stage">
        <div class="wheel" id="wheel">
            <div class="bar"></div>
        </div>
        <div class="ball" id="ball"></div>
    </div>

    <nav class="menu">
        <a href="#" class="card">Instagram <span>→</span></a>
        <a href="#" class="card">Behance <span>→</span></a>
        <a href="#" class="card">WhatsApp <span>→</span></a>
    </nav>

    <footer>PORTUGAL 2026</footer>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');
        const scoreEl = document.getElementById('current-score');
        const highscoreEl = document.getElementById('high-score');
        const layers = [document.getElementById('txt-cyan'), document.getElementById('txt-magenta')];

        let wAngle = 0, wVel = 0, isDrag = false, sAngle = 0;
        let bX = 0, bY = -80, bVX = 0, bVY = 0;
        let score = 0, highscore = 0;

        const GRAVITY = 0.25;
        const FRICTION = 0.98;
        const BOUNCE = 0.6;
        const RADIUS = 125; // Limite interno da roda

        function getMouseAngle(e) {
            const rect = wheel.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
        }

        wheel.addEventListener('mousedown', (e) => { isDrag = true; sAngle = getMouseAngle(e) - wAngle; });
        wheel.addEventListener('touchstart', (e) => { isDrag = true; sAngle = getMouseAngle(e) - wAngle; }, {passive: false});
        
        window.addEventListener('mousemove', (e) => {
            if (!isDrag) return;
            const a = getMouseAngle(e);
            let diff = a - sAngle - wAngle;
            while (diff > 180) diff -= 360;
            while (diff < -180) diff += 360;
            wVel = diff;
            wAngle += diff;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDrag) return;
            const a = getMouseAngle(e);
            let diff = a - sAngle - wAngle;
            while (diff > 180) diff -= 360;
            while (diff < -180) diff += 360;
            wVel = diff;
            wAngle += diff;
        }, {passive: false});

        window.addEventListener('mouseup', () => isDrag = false);
        window.addEventListener('touchend', () => isDrag = false);

        function update() {
            if (!isDrag) {
                wVel *= 0.95;
                wAngle += wVel;
            }

            // Aplicar gravidade
            bVY += GRAVITY;
            bX += bVX;
            bY += bVY;

            // --- LÓGICA DE COLISÃO COM A BARRA ---
            const angleRad = -wAngle * Math.PI / 180;
            const cos = Math.cos(angleRad), sin = Math.sin(angleRad);
            
            // Converter posição da bola para o sistema de coordenadas da barra (local)
            const localX = bX * cos - bY * sin;
            const localY = bX * sin + bY * cos;

            const barW = 70; // Metade da largura da barra
            const barH = 8;  // Metade da altura da barra
            const ballR = 14;

            let isTouching = false;

            if (Math.abs(localX) < barW + ballR && Math.abs(localY) < barH + ballR) {
                // Se a bola estiver acima da barra
                if (localY < 0 && bVY >= 0) {
                    isTouching = true;
                    // Reposicionar a bola exatamente no topo da barra
                    const correctedLocalY = -(barH + ballR);
                    bX = localX * Math.cos(-angleRad) - correctedLocalY * Math.sin(-angleRad);
                    bY = localX * Math.sin(-angleRad) + correctedLocalY * Math.cos(-angleRad);
                    
                    // Inverter velocidade com bounce
                    bVY = -bVY * BOUNCE;
                    // Transferir movimento da rotação para a bola
                    bVX += wVel * 0.5;
                }
            }

            // Score
            if (isTouching && Math.abs(localX) < barW) {
                score += 0.016;
                wheel.classList.add('scoring');
            } else {
                if (score > highscore) highscore = score;
                score = 0;
                wheel.classList.remove('scoring');
            }

            // Colisão com as paredes da roda
            const dist = Math.sqrt(bX * bX + bY * bY);
            if (dist > RADIUS - ballR) {
                const nx = bX / dist, ny = bY / dist;
                bX = nx * (RADIUS - ballR);
                bY = ny * (RADIUS - ballR);
                const dot = bVX * nx + bVY * ny;
                bVX = (bVX - 2 * dot * nx) * BOUNCE;
                bVY = (bVY - 2 * dot * ny) * BOUNCE;
                bVX += -ny * wVel * 0.6;
                bVY += nx * wVel * 0.6;
            }

            bVX *= FRICTION;
            bVY *= FRICTION;

            // Aplicar transformações
            ball.style.transform = `translate(${bX}px, ${bY}px)`;
            wheel.style.transform = `rotate(${wAngle}deg)`;
            
            // Efeito visual no título
            const intensity = Math.abs(wVel) * 0.8;
            layers[0].style.transform = `translate(${intensity}px, ${intensity}px)`;
            layers[1].style.transform = `translate(${-intensity}px, ${-intensity}px)`;

            scoreEl.innerText = score.toFixed(1);
            highscoreEl.innerText = highscore.toFixed(1);

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>

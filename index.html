    <style>
        /* --- 1. DESIGN SYSTEM --- */
        :root {
            --bg: #F2F2F2;
            --text: #050505;
            --accent: #D64933; /* Terracotta da imagem */
            --white: #FFFFFF;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            opacity: 0;
            animation: fadeIn 0.8s var(--ease) forwards;
        }

        /* --- 2. CABEÇALHO --- */
        header {
            text-align: center;
            margin-bottom: 10px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--white);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00C853;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(0, 200, 83, 0.2);
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 10px;
        }

        .role {
            font-size: 1.1rem;
            color: #666;
            font-weight: 500;
        }
        
        .exp-badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
            background: rgba(214, 73, 51, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* --- 3. A RODA FIDGET SPINNER (BOLD) --- */
        .spinner-container {
            position: relative;
            width: 100%;
            height: 320px; /* Espaço generoso */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .wheel {
            width: 240px;
            height: 240px;
            background-color: var(--text); /* Preto Sólido Bold */
            border-radius: 50%;
            position: relative;
            cursor: grab;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            touch-action: none; /* Impede scroll enquanto toca na roda */
            transition: transform 0.1s linear; /* Atualização fluida via JS */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wheel:active {
            cursor: grabbing;
            transform: scale(0.98); /* Feedback tátil visual */
        }

        /* O Ponto Branco (Indicador de Rotação) */
        .wheel-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: var(--white);
            border-radius: 50%;
            top: 30px; /* Distância da borda */
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        /* Texto decorativo no centro */
        .wheel-center-text {
            color: var(--white);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.5;
            pointer-events: none;
            user-select: none;
        }

        /* Instrução flutuante */
        .drag-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.75rem;
            color: #999;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
        }

        /* --- 4. LINKS (LISTA MODERNA) --- */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background: var(--white);
            padding: 24px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon-svg {
            width: 28px;
            height: 28px;
            fill: var(--text);
            transition: fill 0.3s ease;
        }

        .link-text h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        
        .link-text p {
            font-size: 0.9rem;
            color: #888;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .arrow {
            font-size: 1.5rem;
            transform: rotate(-45deg);
            transition: transform 0.3s ease;
            z-index: 2;
        }

        /* HOVER EFFECT: Inversão de Cores */
        .link-card:hover {
            background: var(--text);
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .link-card:hover h3, 
        .link-card:hover .arrow {
            color: var(--white);
        }
        
        .link-card:hover p {
            color: rgba(255,255,255,0.6);
        }

        .link-card:hover .icon-svg {
            fill: var(--white);
        }

        .link-card:hover .arrow {
            transform: rotate(0deg);
        }

        /* --- 5. RODAPÉ --- */
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
            font-weight: 500;
        }

        /* KEYFRAMES */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(0, 200, 83, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

    </style>
</head>

    <script>
        const wheel = document.getElementById('wheel');
        let currentAngle = 0;
        let isDragging = false;
        let startAngle = 0;
        let previousAngle = 0;
        let velocity = 0;
        let animationFrame;
        let lastTime = 0;

        // Função para calcular o ângulo baseado na posição do mouse/toque
        function getAngle(x, y) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            // Math.atan2 retorna o ângulo em radianos, convertemos para graus
            return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
        }

        // --- EVENT LISTENERS (Mouse & Touch) ---

        // Iniciar
        function startDrag(e) {
            isDragging = true;
            velocity = 0; // Parar inércia ao agarrar
            cancelAnimationFrame(animationFrame); // Parar loop de física
            
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            
            // Ângulo inicial do clique em relação ao centro
            const angle = getAngle(clientX, clientY);
            // Ajustar o offset para a roda não "saltar" para a posição do mouse
            startAngle = angle - currentAngle;
            
            wheel.style.cursor = 'grabbing';
        }

        // Mover
        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); // Evitar scroll em mobile

            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            
            const angle = getAngle(clientX, clientY);
            const newAngle = angle - startAngle;

            // Calcular velocidade instantânea (Delta do ângulo)
            // Lidar com a virada de 180 para -180
            let delta = newAngle - currentAngle;
            
            // Atualizar ângulo
            currentAngle = newAngle;
            velocity = delta; // A velocidade é o quanto movemos neste frame

            wheel.style.transform = `rotate(${currentAngle}deg)`;
        }

        // Soltar (Ativar Inércia)
        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            wheel.style.cursor = 'grab';
            
            // Iniciar loop de inércia
            requestAnimationFrame(inertiaLoop);
        }

        // --- FÍSICA DE INÉRCIA (O Efeito Fidget Spinner) ---
        function inertiaLoop() {
            if (isDragging) return;

            // Desaceleração (Fricção)
            velocity *= 0.95; // Perde 5% de velocidade a cada frame

            // Parar se for muito lento
            if (Math.abs(velocity) < 0.1) {
                velocity = 0;
                return;
            }

            currentAngle += velocity;
            wheel.style.transform = `rotate(${currentAngle}deg)`;
            
            requestAnimationFrame(inertiaLoop);
        }

        // Adicionar eventos
        wheel.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        wheel.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('touchend', stopDrag);

        // Um pequeno impulso inicial para mostrar que roda
        setTimeout(() => {
            velocity = 15; // Velocidade inicial
            inertiaLoop();
        }, 1000);

    </script>

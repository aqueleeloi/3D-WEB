<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg: #F0F0F2;
            --text: #080808;
            --white: #FFFFFF;
            --wheel-black: #111111;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 10px 20px;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            z-index: 10;
            padding-top: 10px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 1;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .exp-pill {
            border: 1px solid rgba(0,0,0,0.1);
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(255,255,255,0.6);
        }

        /* --- A ÁREA DA RODA (Stage) --- */
        .stage {
            flex-grow: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Container que segura a sombra e a roda separadamente */
        .wheel-assembly {
            position: relative;
            width: 280px;
            height: 280px;
        }

        /* Responsivo para ecrãs pequenos */
        @media (max-height: 700px) {
            .wheel-assembly { width: 220px; height: 220px; }
            h1 { font-size: 1.8rem; }
        }

        /* A SOMBRA ESTÁTICA (Correção: Não gira) */
        .static-shadow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            border-radius: 50%;
            background: transparent;
            box-shadow: 0 30px 70px rgba(0,0,0,0.25);
            z-index: 0;
            pointer-events: none;
        }

        /* A RODA QUE GIRA */
        .wheel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--wheel-black);
            cursor: grab;
            z-index: 2;
            will-change: transform;
            /* Detalhe de luz sutil para dar volume 3D sem girar a sombra */
            box-shadow: inset 0 4px 20px rgba(255,255,255,0.15), inset 0 -10px 30px rgba(0,0,0,0.8);
        }

        .wheel:active { cursor: grabbing; }

        /* O PONTO (Anchor) */
        .dot-anchor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Esta div não roda com o JS, ela roda dentro da wheel */
        }

        .dot {
            position: absolute;
            top: 25px; /* Distância do topo */
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255,255,255,0.9);
            z-index: 4;
        }

        /* O RASTO (TRAIL) - A Criatividade */
        /* SVG circular sobreposto para fazer o efeito de rasto */
        .trail-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            transform: rotate(-90deg); /* Começar no topo */
        }

        .trail-path {
            fill: none;
            stroke: rgba(255,255,255,0.4); /* Rasto branco semitransparente */
            stroke-width: 14; /* Mesma largura do ponto */
            stroke-linecap: round;
            /* O segredo: dasharray controla o comprimento do rasto */
            stroke-dasharray: 0, 1000; 
            transition: stroke-dasharray 0.1s linear; /* Fluidez */
        }

        /* --- LINKS --- */
        .menu {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
            z-index: 10;
        }

        .card {
            background: var(--white);
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.04);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon { width: 22px; height: 22px; }
        
        .card-title {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: -0.01em;
        }

        .card-arrow { 
            opacity: 0.2; 
            transform: translateX(0);
            transition: all 0.2s;
        }

        /* Interatividade dos botões */
        .card:active { transform: scale(0.96); }
        
        @media(hover: hover) {
            .card:hover {
                transform: scale(1.02);
                background: var(--text);
                color: var(--white);
                border-color: var(--text);
            }
            .card:hover .card-arrow { opacity: 1; fill: white; transform: translateX(5px); }
            .card:hover svg { fill: white; }
        }

        /* Footer minúsculo */
        .status {
            font-size: 0.7rem;
            color: #AAA;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 10px;
        }

    </style>
</head>

    <script>
        const wheel = document.getElementById('wheel');
        const trail = document.getElementById('trail');
        
        // Variáveis de Física
        let currentAngle = 0;
        let isDragging = false;
        let startAngle = 0;
        let velocity = 0;
        let animationFrame;

        // Função para calcular ângulo
        function getAngle(x, y) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
        }

        // Função Visual (Rasto do Cometa)
        function updateVisuals(vel) {
            // Normalizar velocidade para o efeito (0 a 100+)
            const speed = Math.abs(vel);
            
            // O rasto (dasharray) aumenta com a velocidade
            // StrokeDasharray: primeiro valor é o comprimento do traço, segundo é o espaço
            const trailLength = Math.min(speed * 3, 220); // Limite máximo do rasto
            trail.style.strokeDasharray = `${trailLength}, 1000`;
            
            // Escala (Squash & Stretch sutil)
            const scale = 1 + Math.min(speed / 1000, 0.05); // Cresce até 5%
            wheel.style.transform = `rotate(${currentAngle}deg) scale(${scale})`;
        }

        // --- DRAG EVENTS ---

        function startDrag(e) {
            isDragging = true;
            velocity = 0;
            cancelAnimationFrame(animationFrame);
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startAngle = getAngle(clientX, clientY) - currentAngle;
            wheel.style.cursor = 'grabbing';
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); // Previne scroll no mobile

            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            const angle = getAngle(clientX, clientY);
            
            const newAngle = angle - startAngle;
            let delta = newAngle - currentAngle;

            // Correção matemática para a rotação contínua (evitar salto 360->0)
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;

            velocity = delta;
            currentAngle = newAngle;

            updateVisuals(velocity);
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            wheel.style.cursor = 'grab';
            requestAnimationFrame(inertiaLoop);
        }

        // --- INÉRCIA ---
        function inertiaLoop() {
            if (isDragging) return;

            // Fricção super baixa (0.99) para rodar muito tempo
            velocity *= 0.99;

            // Parar quando estiver muito lento
            if (Math.abs(velocity) < 0.01) {
                velocity = 0;
                updateVisuals(0);
                return;
            }

            currentAngle += velocity;
            updateVisuals(velocity);
            
            requestAnimationFrame(inertiaLoop);
        }

        // --- LISTENERS ---
        wheel.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        wheel.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('touchend', stopDrag);

        // Impulso inicial para demo
        setTimeout(() => {
            velocity = 20;
            inertiaLoop();
        }, 500);

    </script>

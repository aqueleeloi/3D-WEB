    <style>
        :root {
            --bg: #ECECF0; /* Fundo ligeiramente mais técnico */
            --text: #050505;
            --white: #FFFFFF;
            --wheel-border: #1a1a1a;
            --ball-color: #FF3300; /* Laranja mais agressivo */
            --neon-cyan: #00FFFF;
            --neon-pink: #FF0055;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; touch-action: manipulation; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; height: 100dvh; width: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 24px 30px 24px; }

        /* --- TITULO VOLUMÉTRICO 3D --- */
        header { 
            text-align: center; z-index: 10; pointer-events: none; width: 100%;
            height: 110px; display: flex; align-items: center; justify-content: center;
            perspective: 800px; /* Perspetiva profunda */
        }

        .title-wrapper { 
            position: relative; display: inline-block; 
            transform-style: preserve-3d; /* Permite elementos 3D filhos */
        }

        h1 {
            font-size: 3.8rem; font-weight: 900; text-transform: uppercase;
            letter-spacing: -0.04em; line-height: 0.9; margin: 0; padding: 0;
            color: transparent; 
        }

        .title-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            white-space: nowrap; will-change: transform, filter, opacity;
            backface-visibility: hidden;
        }

        /* Camadas dispostas em profundidade Z */
        .layer-main { color: #000; z-index: 10; transform: translateZ(0); }
        .layer-red { color: var(--neon-pink); z-index: 5; mix-blend-mode: multiply; opacity: 0; transform: translateZ(-20px); }
        .layer-cyan { color: var(--neon-cyan); z-index: 5; mix-blend-mode: multiply; opacity: 0; transform: translateZ(-40px); }

        .badge {
            position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
            background: var(--white); border: 1px solid rgba(0,0,0,0.08); padding: 5px 16px; border-radius: 100px;
            font-size: 0.75rem; font-weight: 600; color: #888; letter-spacing: 0.05em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* --- STAGE 3D --- */
        .stage { 
            position: relative; width: 300px; height: 300px; 
            display: flex; align-items: center; justify-content: center; 
            perspective: 1000px; /* Perspetiva global para o 3D */
        }

        .wheel-container {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d; /* Crucial para o obstáculo 3D */
        }

        .static-shadow { position: absolute; width: 90%; height: 90%; top: 5%; left: 5%; border-radius: 50%; background: transparent; box-shadow: 0 40px 80px rgba(0,0,0,0.15); z-index: 0; pointer-events: none; transform: translateZ(-50px); }

        .wheel {
            position: relative; width: 100%; height: 100%; border-radius: 50%;
            border: 14px solid var(--wheel-border); cursor: grab; z-index: 2; 
            background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.02) 100%);
            transform-style: preserve-3d;
        }
        .wheel:active { cursor: grabbing; border-color: #000; }

        /* --- OBSTÁCULO 3D QUANTUM --- */
        .obstacle-anchor {
            position: absolute; top: 45px; left: 50%;
            width: 26px; height: 26px; margin-left: -13px;
            transform-style: preserve-3d; /* Permite rotação 3D real */
            z-index: 4;
        }

        .obstacle {
            width: 100%; height: 100%;
            background-color: #0a0a0a; /* Material escuro */
            border-radius: 3px;
            /* Transição super rápida para impacto físico */
            transition: transform 0.08s cubic-bezier(0.1, 0.9, 0.2, 1), box-shadow 0.08s, filter 0.05s;
            will-change: transform;
            /* Borda subtil metálica */
            border: 1px solid #333;
            position: relative;
            transform-origin: center center -13px; /* Roda em torno do seu centro 3D */
        }

        /* O NÚCLEO DE ENERGIA (Escondido atrás) */
        .obstacle::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            transform: translateZ(-2px) scale(0.9); /* Ligeiramente atrás e menor */
            opacity: 0; transition: all 0.1s;
            box-shadow: 0 0 30px var(--neon-cyan), 0 0 50px var(--neon-pink);
            border-radius: 3px;
            filter: blur(4px);
        }
        
        /* Estado de Impacto */
        .obstacle.hit::before {
            opacity: 1;
            transform: translateZ(-15px) scale(1.8); /* Explode para trás e cresce */
        }
        .obstacle.hit {
            filter: brightness(1.5); /* Flash de luz no impacto */
        }


        /* BOLA FÍSICA */
        .ball {
            position: absolute; width: 34px; height: 34px;
            background: radial-gradient(circle at 30% 30%, #ff8a66, var(--ball-color));
            border-radius: 50%; z-index: 10;
            box-shadow: 0 6px 15px rgba(255, 51, 0, 0.3), inset 0 -2px 5px rgba(0,0,0,0.2);
            top: 50%; left: 50%; margin-top: -17px; margin-left: -17px;
            pointer-events: none; will-change: transform;
            transform: translateZ(20px); /* Bola flutua acima da roda */
        }

        /* LINKS */
        .menu { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; z-index: 20; transform: translateZ(50px); }
        .card {
            background: var(--white); padding: 18px 25px; border-radius: 18px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: var(--text); font-weight: 700; transition: all 0.2s; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .card-left { display: flex; align-items: center; gap: 14px; } .card-icon { width: 22px; height: 22px; fill: currentColor; }
        .card:active { transform: scale(0.98); background: #f5f5f5; }
        footer { font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 0.2em; margin-top: 20px; font-weight: 700;}
        #sound-hint { position: absolute; top: 125px; font-size: 0.65rem; font-weight: 700; color: #aaa; opacity: 0; letter-spacing: 0.1em; }

    </style>
</head>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');
        const obstacle = document.getElementById('obstacle');
        
        const titleMain = document.getElementById('title-main');
        const titleRed = document.getElementById('title-red');
        const titleCyan = document.getElementById('title-cyan');

        // AUDIO
        let audioCtx = null;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const hint = document.getElementById('sound-hint');
            hint.style.opacity = 1; setTimeout(() => hint.style.opacity = 0, 3000);
        }
        function playRatchet(velocity) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const speed = Math.min(Math.abs(velocity), 50);
            osc.frequency.setValueAtTime(100 + (speed * 5), audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.type = 'triangle'; osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }
        function playClack(force) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            // Som mais grave e forte com o impacto
            osc.frequency.setValueAtTime(250 - (force*2), audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(Math.min(0.1 + force*0.01, 0.4), audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.12);
            osc.type = 'square'; osc.start(); osc.stop(audioCtx.currentTime + 0.12);
        }

        // --- EFEITO TÍTULO VOLUMÉTRICO ---
        function updateVolumetricTitle(velocity) {
            const speed = Math.abs(velocity);
            // Quanto mais rápido, mais as camadas se afastam em Z e desfocam
            const zDepth = Math.min(speed * 2, 100); // Profundidade Z
            const blur = Math.min(speed * 0.3, 8);
            const opacity = Math.min(speed * 0.03, 0.8);

            if (speed > 1) {
                // Camadas traseiras afastam-se e desfocam
                titleRed.style.transform = `translateZ(-${zDepth*1.5}px) scale(0.95)`;
                titleRed.style.filter = `blur(${blur}px)`;
                titleRed.style.opacity = opacity;
                
                titleCyan.style.transform = `translateZ(-${zDepth*3}px) scale(0.9)`;
                titleCyan.style.filter = `blur(${blur*1.5}px)`;
                titleCyan.style.opacity = opacity;
                
                // Camada principal aproxima-se ligeiramente
                titleMain.style.transform = `translateZ(${zDepth*0.2}px)`;
            } else {
                titleRed.style.transform = 'translateZ(-20px)'; titleRed.style.filter = 'none'; titleRed.style.opacity = 0;
                titleCyan.style.transform = 'translateZ(-40px)'; titleCyan.style.filter = 'none'; titleCyan.style.opacity = 0;
                titleMain.style.transform = 'translateZ(0)';
            }
        }

        // --- FÍSICA 3D REATIVA DO OBSTÁCULO ---
        let obsImpactForce = 0;
        let impactNX = 0; let impactNY = 0; // Normal do impacto

        function apply3DImpact() {
            if (obsImpactForce > 0.5) {
                // Rotação 3D baseada na direção do impacto
                // Se bater da esquerda (nx < 0), roda no eixo Y positivo.
                const rotateY = -impactNX * obsImpactForce * 2.5; // Rotação horizontal
                const rotateX = impactNY * obsImpactForce * 2.5;  // Rotação vertical
                
                // Empurrão para trás em Z (Profundidade)
                const pushZ = -obsImpactForce * 3; // Empurra até -150px

                obstacle.style.transform = `
                    rotateX(${rotateX}deg) 
                    rotateY(${rotateY}deg) 
                    translateZ(${pushZ}px)
                `;
                
                // Ativa o núcleo de energia
                obstacle.classList.add('hit');

                obsImpactForce *= 0.85; // Decaimento rápido
            } else {
                obstacle.style.transform = 'rotateX(0) rotateY(0) translateZ(0)';
                obstacle.classList.remove('hit');
                obsImpactForce = 0;
            }
        }

        // FÍSICA CORE
        let wAngle = 0, isDrag = false, sAngle = 0, wVel = 0, lastTick = 0;
        let bX = 0, bY = 0, bVX = 0, bVY = 0;
        const GRAVITY = 0.45, FRICTION = 0.995, BOUNCE = 0.75;
        const LIMIT = 115; 
        const OBS_RADIUS = 105; 
        const OBS_HIT_RAD = 30; 

        function getA(x, y) {
            const r = wheel.getBoundingClientRect();
            return Math.atan2(y - (r.top + r.height/2), x - (r.left + r.width/2)) * 180 / Math.PI;
        }

        function start(e) {
            initAudio(); isDrag = true; wVel = 0;
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            sAngle = getA(cx, cy) - wAngle;
        }

        function move(e) {
            if (!isDrag) return;
            e.preventDefault();
            const cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            const a = getA(cx, cy);
            let d = (a - sAngle) - wAngle;
            if (d > 180) d -= 360; if (d < -180) d += 360;
            wVel = d; wAngle += d;
            wheel.style.transform = `rotate(${wAngle}deg)`;
            if (Math.abs(wAngle - lastTick) > 15) { playRatchet(wVel); lastTick = wAngle; }
        }

        function end() { isDrag = false; }

        function loop() {
            if (!isDrag) {
                wVel *= 0.985; wAngle += wVel;
                wheel.style.transform = `rotate(${wAngle}deg)`;
                if (Math.abs(wAngle - lastTick) > 15 && Math.abs(wVel) > 0.5) { playRatchet(wVel); lastTick = wAngle; }
            }
            
            updateVolumetricTitle(wVel);
            apply3DImpact();

            // FÍSICA BOLA
            bVY += GRAVITY; bX += bVX; bY += bVY;

            const rad = (wAngle - 90) * (Math.PI / 180);
            const obsX = Math.cos(rad) * OBS_RADIUS;
            const obsY = Math.sin(rad) * OBS_RADIUS;
            const dx = bX - obsX;
            const dy = bY - obsY;
            const distObs = Math.sqrt(dx*dx + dy*dy);

            if (distObs < OBS_HIT_RAD) {
                const nx = dx / distObs; const ny = dy / distObs;
                const overlap = OBS_HIT_RAD - distObs;
                bX += nx * overlap; bY += ny * overlap; 
                
                const dot = bVX * nx + bVY * ny;
                bVX -= 2 * dot * nx; bVY -= 2 * dot * ny;
                
                const spinForce = wVel * 1.5;
                bVX += -ny * spinForce; bVY += nx * spinForce;

                // CALCULAR IMPACTO 3D
                const totalForce = Math.sqrt(bVX*bVX + bVY*bVY) + Math.abs(spinForce);
                playClack(totalForce);
                
                impactNX = nx; // Guardar a normal do impacto para a rotação
                impactNY = ny;
                obsImpactForce = Math.min(totalForce * 2, 50); // Força máxima do impacto
            }

            const d = Math.sqrt(bX*bX + bY*bY);
            if (d > LIMIT) {
                const nx = bX/d, ny = bY/d;
                bX = nx*LIMIT; bY = ny*LIMIT;
                const dot = bVX*nx + bVY*ny;
                bVX -= 2*dot*nx; bVY -= 2*dot*ny;
                bVX *= BOUNCE; bVY *= BOUNCE;
                const s = wVel * 1.2; bVX += -ny*s; bVY += nx*s;
            }
            bVX *= FRICTION; bVY *= FRICTION;
            // A bola também se move em Z para dar profundidade
            ball.style.transform = `translate3d(${bX}px, ${bY}px, 20px)`;

            requestAnimationFrame(loop);
        }

        const p = {passive: false};
        wheel.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        wheel.addEventListener('touchstart', start, p);
        window.addEventListener('touchmove', move, p);
        window.addEventListener('touchend', end);

        bY = 50; loop();
    </script>

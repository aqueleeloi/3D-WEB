<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eloi Silva | Visual Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CONFIGURAÇÃO VISUAL (DESIGN SYSTEM) --- */
        :root {
            --bg: #F4F4F4;        /* Cinza muito claro, quase branco (papel) */
            --text: #050505;      /* Preto profundo */
            --accent: #FF3B30;    /* Vermelho alaranjado internacional */
            --card-bg: #FFFFFF;
            --border: rgba(0,0,0,0.08);
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 500px; /* Largura focada para leitura vertical */
            display: flex;
            flex-direction: column;
            gap: 40px;
            animation: fadeIn 1s var(--ease) forwards;
            opacity: 0;
        }

        /* --- 2. CABEÇALHO --- */
        header {
            text-align: left;
            position: relative;
        }

        .availability-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text);
            margin-bottom: 16px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 100px;
            background: white;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background-color: #00D26A; /* Verde sinal */
            border-radius: 50%;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            font-weight: 400;
            line-height: 1.5;
        }

        /* --- 3. O "DIAL" MODERNO (SOLTO E SEM FUNDO) --- */
        .visual-element {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            position: relative;
        }

        /* O círculo SVG que gira */
        .spinner-svg {
            width: 140px;
            height: 140px;
            animation: spin 10s linear infinite; /* Rotação lenta e constante */
            cursor: pointer;
            transition: transform 0.5s var(--ease);
        }

        .spinner-svg:hover {
            animation-play-state: paused;
            transform: scale(1.1);
        }

        .spinner-center-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            pointer-events: none;
        }

        /* --- 4. LISTA DE LINKS (ESTILO LISTA SUIÇA) --- */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 24px;
            text-decoration: none;
            color: var(--text);
            border: 1px solid transparent;
            border-radius: 16px;
            transition: all 0.3s var(--ease);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        /* Ícones SVG em vez de Emojis */
        .icon-svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            margin-right: 16px;
        }

        .link-content {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        .link-title {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .arrow-right {
            opacity: 0.3;
            transition: transform 0.3s var(--ease), opacity 0.3s;
        }

        /* HOVER EFFECT - INVERSÃO DE CORES (Super Moderno) */
        .link-item:hover {
            background-color: var(--text); /* Fica preto */
            color: white; /* Texto fica branco */
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        .link-item:hover .arrow-right {
            opacity: 1;
            transform: translateX(5px);
            fill: white;
        }
        
        /* Destaque sutil para Behance */
        .link-item.featured {
            border: 1px solid var(--text);
        }

        /* --- 5. RODAPÉ --- */
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* ANIMAÇÕES */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

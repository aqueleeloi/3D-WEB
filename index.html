<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eloi Silva | Balance Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F2F2F4; --text: #000; --accent: #FF4500; --wheel: #000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; background: var(--bg); font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 20px; }

        header { text-align: center; width: 100%; }
        .buzz-text { font-size: 2.2rem; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 10px; }
        
        .score-container {
            display: inline-flex; gap: 15px; background: #fff; padding: 10px 20px; 
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-weight: 900; font-size: 0.9rem;
        }
        #current-score { color: var(--accent); }

        .stage { position: relative; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .wheel-container { width: 100%; height: 100%; position: relative; }
        
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 12px solid var(--wheel);
            position: absolute; top: 0; left: 0; z-index: 2;
        }
        .bar {
            position: absolute; width: 100px; height: 16px; background: var(--wheel);
            top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 10px;
        }
        .ball {
            position: absolute; width: 28px; height: 28px; background: var(--accent);
            border-radius: 50%; z-index: 5; pointer-events: none; will-change: transform;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .menu { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
        .card { background: #fff; padding: 14px 20px; border-radius: 12px; text-decoration: none; color: #000; font-weight: 600; display: flex; justify-content: space-between; font-size: 0.9rem; border: 1px solid rgba(0,0,0,0.03); }
        
        footer { font-size: 0.6rem; color: #bbb; letter-spacing: 0.1em; }
    </style>
</head>
<body>

    <header>
        <h1 class="buzz-text">ELOI SILVA</h1>
        <div class="score-container">
            <span>TIME: <span id="current-score">0.0</span>s</span>
            <span>BEST: <span id="high-score">0.0</span>s</span>
        </div>
    </header>

    <div class="stage" id="stage">
        <div class="wheel-container" id="controller">
            <div class="wheel" id="wheel">
                <div class="bar"></div>
            </div>
        </div>
        <div class="ball" id="ball"></div>
    </div>

    <nav class="menu">
        <a href="https://www.instagram.com/aquele.eloi" class="card">Instagram <span>→</span></a>
        <a href="https://www.behance.net/eloi_silva" class="card">Behance <span>→</span></a>
    </nav>

    <footer>PORTUGAL 2026</footer>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');
        const controller = document.getElementById('controller');
        const scoreEl = document.getElementById('current-score');
        const highscoreEl = document.getElementById('high-score');

        let wAngle = 0, wVel = 0, isDrag = false, lastA = 0;
        let bX = 0, bY = -80, bVX = 0, bVY = 0;
        let score = 0, highscore = 0;

        const GRAVITY = 0.3;
        const FRICTION = 0.98;
        const BOUNCE = 0.4;
        const RADIUS = 128; 
        const BAR_W = 50, BAR_H = 8, BALL_R = 14;

        function getAngle(e) {
            const rect = controller.getBoundingClientRect();
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - cx;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - cy;
            return Math.atan2(y, x);
        }

        controller.addEventListener('mousedown', (e) => { isDrag = true; lastA = getAngle(e); });
        controller.addEventListener('touchstart', (e) => { isDrag = true; lastA = getAngle(e); e.preventDefault(); }, {passive: false});
        
        window.addEventListener('mousemove', (e) => {
            if (!isDrag) return;
            const a = getAngle(e);
            let diff = a - lastA;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            wVel = diff * (180 / Math.PI);
            wAngle += wVel;
            lastA = a;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDrag) return;
            const a = getAngle(e);
            let diff = a - lastA;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            wVel = diff * (180 / Math.PI);
            wAngle += wVel;
            lastA = a;
        }, {passive: false});

        window.addEventListener('mouseup', () => isDrag = false);
        window.addEventListener('touchend', () => isDrag = false);

        function update() {
            if (!isDrag) { wVel *= 0.95; wAngle += wVel; }

            // Física básica
            bVY += GRAVITY;
            bX += bVX; bY += bVY;

            // --- COLISÃO RÍGIDA ---
            const rad = -wAngle * (Math.PI / 180);
            const cos = Math.cos(rad), sin = Math.sin(rad);
            
            // Localiza a bola em relação à barra
            const lx = bX * cos - bY * sin;
            const ly = bX * sin + bY * cos;

            let balanced = false;

            // Verifica se a bola bateu na barra (caixa de colisão)
            if (Math.abs(lx) < BAR_W + BALL_R && Math.abs(ly) < BAR_H + BALL_R) {
                // Determina se a colisão é por cima (equilíbrio)
                if (ly < 0 && bVY >= 0) {
                    balanced = true;
                    // Força a bola a ficar EXACTAMENTE em cima da barra (Rigidez)
                    const fixedLocalY = -(BAR_H + BALL_R);
                    bX = lx * Math.cos(-rad) - fixedLocalY * Math.sin(-rad);
                    bY = lx * Math.sin(-rad) + fixedLocalY * Math.cos(-rad);
                    
                    // Física de deslize baseada no ângulo
                    const tilt = Math.sin(wAngle * Math.PI / 180);
                    bVX += tilt * 0.7; 
                    bVY = 0; // Para a queda vertical
                }
            }

            // Cronómetro
            if (balanced && Math.abs(lx) < BAR_W) {
                score += 0.016;
            } else {
                if (score > highscore) highscore = score;
                score = 0;
            }

            // Parede da roda
            const d = Math.sqrt(bX*bX + bY*bY);
            if (d > RADIUS - BALL_R) {
                const nx = bX/d, ny = bY/d;
                bX = nx * (RADIUS - BALL_R); bY = ny * (RADIUS - BALL_R);
                const dot = bVX*nx + bVY*ny;
                bVX = (bVX - 2*dot*nx) * BOUNCE + (-ny * wVel * 0.4);
                bVY = (bVY - 2*dot*ny) * BOUNCE + (nx * wVel * 0.4);
            }

            bVX *= FRICTION; bVY *= FRICTION;
            
            // Render
            ball.style.transform = `translate(${bX}px, ${bY}px)`;
            wheel.style.transform = `rotate(${wAngle}deg)`;
            scoreEl.innerText = score.toFixed(1);
            highscoreEl.innerText = highscore.toFixed(1);

            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>

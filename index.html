<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eloi Silva | Balance Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F2F2F4; --text: #000; --accent: #FF4500; --wheel: #000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; background: var(--bg); font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 20px; }

        header { text-align: center; width: 100%; }
        .buzz-text { font-size: 2.2rem; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 10px; }
        
        .score-container {
            display: inline-flex; gap: 15px; background: #fff; padding: 10px 20px; 
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-weight: 900; font-size: 0.9rem;
        }
        #current-score { color: var(--accent); }

        .stage { position: relative; width: 280px; height: 280px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .wheel-container { width: 100%; height: 100%; position: relative; }
        
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 12px solid var(--wheel);
            position: absolute; top: 0; left: 0; z-index: 2;
        }
        .bar {
            position: absolute; width: 110px; height: 16px; background: var(--wheel);
            top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 10px;
        }
        .ball {
            position: absolute; width: 28px; height: 28px; background: var(--accent);
            border-radius: 50%; z-index: 5; pointer-events: none; will-change: transform;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: background 0.1s;
        }
        .ball.active { background: #FF2200; box-shadow: 0 0 15px rgba(255, 69, 0, 0.5); }

        .menu { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
        .card { background: #fff; padding: 14px 20px; border-radius: 12px; text-decoration: none; color: #000; font-weight: 600; display: flex; justify-content: space-between; font-size: 0.9rem; border: 1px solid rgba(0,0,0,0.03); }
        
        footer { font-size: 0.6rem; color: #bbb; letter-spacing: 0.1em; }
    </style>
</head>
<body>

    <header>
        <h1 class="buzz-text">ELOI SILVA</h1>
        <div class="score-container">
            <span>TIME: <span id="current-score">0.0</span>s</span>
            <span>BEST: <span id="high-score">0.0</span>s</span>
        </div>
    </header>

    <div class="stage" id="stage">
        <div class="wheel-container" id="controller">
            <div class="wheel" id="wheel">
                <div class="bar"></div>
            </div>
        </div>
        <div class="ball" id="ball"></div>
    </div>

    <nav class="menu">
        <a href="https://www.instagram.com/aquele.eloi" target="_blank" class="card">Instagram <span>→</span></a>
        <a href="https://www.behance.net/eloi_silva" target="_blank" class="card">Behance <span>→</span></a>
        <a href="https://api.whatsapp.com/send/?phone=351913525033" target="_blank" class="card">WhatsApp <span>→</span></a>
    </nav>

    <footer>PORTUGAL 2026</footer>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');
        const controller = document.getElementById('controller');
        const scoreEl = document.getElementById('current-score');
        const highscoreEl = document.getElementById('high-score');

        let wAngle = 0, wVel = 0, isDrag = false, lastA = 0;
        let bX = 0, bY = -80, bVX = 0, bVY = 0;
        let score = 0, highscore = 0;
        let resetTimer = null; // Para evitar reset imediato

        const GRAVITY = 0.35;
        const FRICTION_AIR = 0.99;
        const FRICTION_BAR = 0.92; // Mais atrito na barra para controlo
        const BOUNCE = 0.3;
        const RADIUS = 128; 
        const BAR_W = 55, BAR_H = 8, BALL_R = 14;

        function getAngle(e) {
            const rect = controller.getBoundingClientRect();
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - cx;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - cy;
            return Math.atan2(y, x);
        }

        controller.addEventListener('mousedown', (e) => { isDrag = true; lastA = getAngle(e); });
        controller.addEventListener('touchstart', (e) => { isDrag = true; lastA = getAngle(e); e.preventDefault(); }, {passive: false});
        
        window.addEventListener('mousemove', (e) => {
            if (!isDrag) return;
            const a = getAngle(e);
            let diff = a - lastA;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            wVel = diff * (180 / Math.PI);
            wAngle += wVel;
            lastA = a;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDrag) return;
            const a = getAngle(e);
            let diff = a - lastA;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            wVel = diff * (180 / Math.PI);
            wAngle += wVel;
            lastA = a;
        }, {passive: false});

        window.addEventListener('mouseup', () => isDrag = false);
        window.addEventListener('touchend', () => isDrag = false);

        function update() {
            if (!isDrag) { wVel *= 0.95; wAngle += wVel; }

            // Gravidade
            bVY += GRAVITY;
            bX += bVX; bY += bVY;

            // --- FÍSICA E COLISÃO ---
            const rad = -wAngle * (Math.PI / 180);
            const cos = Math.cos(rad), sin = Math.sin(rad);
            
            // Coordenadas Locais (Bola relativa à barra)
            const lx = bX * cos - bY * sin;
            const ly = bX * sin + bY * cos;

            let touchingBar = false;

            // Caixa de Colisão (Um pouco mais generosa para cima para não piscar o score)
            if (Math.abs(lx) < BAR_W + BALL_R && ly > -(BAR_H + BALL_R + 5) && ly < (BAR_H + BALL_R)) {
                
                // Se estiver a tocar no topo ou perto dele
                if (ly < 0) {
                    touchingBar = true;
                    
                    // Colisão Rígida: Não deixa passar para baixo
                    const surfaceY = -(BAR_H + BALL_R);
                    if (ly > surfaceY) {
                        // Reposiciona a bola na superfície
                        bX = lx * Math.cos(-rad) - surfaceY * Math.sin(-rad);
                        bY = lx * Math.sin(-rad) + surfaceY * Math.cos(-rad);
                        
                        // Recalcula velocidades (Slope Physics)
                        // A inclinação da barra afeta a velocidade lateral
                        const slope = Math.sin(wAngle * Math.PI / 180);
                        bVX += slope * 0.8; 
                        
                        // Transferência de momentum da rotação para a bola
                        // Se rodares rápido, a bola é atirada
                        bVX += wVel * 0.03; 

                        // Anula velocidade vertical relativa à barra (para não saltar que nem maluca)
                        bVY = 0;
                        
                        // Aplica atrito forte quando está na barra
                        bVX *= FRICTION_BAR;
                        bVY *= FRICTION_BAR;
                    }
                }
            }

            // --- LÓGICA DE PONTUAÇÃO (Com tolerância) ---
            if (touchingBar && Math.abs(lx) < BAR_W) {
                // Se está na barra
                score += 0.016;
                ball.classList.add('active');
                
                // Cancela qualquer reset pendente
                if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
                
            } else {
                ball.classList.remove('active');
                
                // Se a bola sair da barra, espera um pouco antes de zerar (Tolerância)
                // Mas se bater na parede exterior, zera logo
                const dist = Math.sqrt(bX*bX + bY*bY);
                if (dist > RADIUS - BALL_R - 5) {
                    score = 0; // Bateu na parede, perdeu logo
                } else if (!resetTimer && score > 0) {
                    // Saiu da barra mas ainda está no ar? Dá 0.2s de tolerância
                    resetTimer = setTimeout(() => {
                        if (score > highscore) highscore = score;
                        score = 0;
                        resetTimer = null;
                    }, 200);
                }
            }

            // Paredes Exteriores
            const dist = Math.sqrt(bX*bX + bY*bY);
            if (dist > RADIUS - BALL_R) {
                const nx = bX/dist, ny = bY/dist;
                bX = nx * (RADIUS - BALL_R); bY = ny * (RADIUS - BALL_R);
                const dot = bVX*nx + bVY*ny;
                bVX = (bVX - 2*dot*nx) * BOUNCE + (-ny * wVel * 0.3);
                bVY = (bVY - 2*dot*ny) * BOUNCE + (nx * wVel * 0.3);
            }

            if (!touchingBar) {
                bVX *= FRICTION_AIR; 
                bVY *= FRICTION_AIR;
            }

            // Render
            ball.style.transform = `translate(${bX}px, ${bY}px)`;
            wheel.style.transform = `rotate(${wAngle}deg)`;
            scoreEl.innerText = score.toFixed(1);
            highscoreEl.innerText = highscore.toFixed(1);

            requestAnimationFrame(update);
        }
        update();
    </script>
</body>
</html>

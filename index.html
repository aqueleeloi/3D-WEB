<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Elói Silva - Artista de Variedades</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent: #ff4757; 
            --text: #4d5b6d;
            --text-dark: #454f54; 
            --text-soft: #9aa5b1;
            --win: #00ca85;
            --lose: #ff1744;
            --marker: #aab8c2;
            --fret: #cbd1d8;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-user-select: none; 
            -moz-user-select: none; 
            -ms-user-select: none; 
            user-select: none; 
            touch-action: none; 
            margin: 0; padding: 0; 
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            overscroll-behavior: none; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: scale(var(--scale, 1));
            transform-origin: center center;
            width: 100%;
        }

        /* --- TÍTULO E SUBTÍTULO ALINHADOS À LARGURA DAS REDES --- */
        .portfolio-title-container {
            margin-top: -4vh; 
            margin-bottom: 80px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1000;
        }
        
        #titleSvg {
            width: 368px; 
            height: auto;
            fill: var(--text-dark);
            display: block;
            will-change: transform, filter;
            transition: transform 0.15s ease-out, filter 0.15s ease-out;
        }

        .portfolio-title-container .role {
            font-family: 'Playfair Display', serif;
            font-size: 0.8rem; 
            font-style: italic;
            letter-spacing: 6.5px; 
            color: var(--text-soft);
            margin-top: 5px;
            text-transform: uppercase;
            padding-left: 7.5px; 
        }

        /* --- PALCO (460px) --- */
        .stage {
            position: relative; 
            width: 460px; 
            height: 460px;
            display: grid; place-items: center;
            border-radius: 50%;
            transition: box-shadow 0.4s ease;
            z-index: 10;
        }

        .base-outer {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: var(--bg);
            box-shadow: 25px 25px 60px var(--shadow-dark), -25px -25px 60px var(--shadow-light);
            z-index: 0;
        }

        .track-inner {
            position: absolute; 
            width: 380px; 
            height: 380px; 
            border-radius: 50%;
            background: var(--bg);
            box-shadow: inset 8px 8px 25px var(--shadow-dark), inset -8px -8px 25px var(--shadow-light);
            z-index: 1;
        }

        /* --- BOLA DE PORCELANA (CENTRADA NA CALHA) --- */
        .ball-layer {
            position: absolute; width: 100%; height: 100%; 
            z-index: 500; pointer-events: none;
        }
        .ball {
            position: absolute;
            top: 40px; /* Centrada matematicamente entre o Hub e a borda exterior */
            left: 50%; 
            width: 40px; height: 40px; 
            border-radius: 50%; 
            will-change: transform;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fcfcfc 15%, #e8e8e8 45%, #b8b8b8 75%, #8a8a8a 100%);
            box-shadow: inset -2px -2px 8px rgba(69, 79, 84, 0.05), 4px 4px 10px rgba(69, 79, 84, 0.25);          
        }

        .touch-ball-zone {
            position: absolute; 
            width: 460px; height: 460px; 
            border-radius: 50%;
            z-index: 300; cursor: grab;
            -webkit-mask-image: radial-gradient(circle, transparent 150px, black 151px);
            mask-image: radial-gradient(circle, transparent 150px, black 151px);
        }

        /* --- HUB CENTRAL (300px) --- */
        .center-hub {
            position: absolute; 
            width: 300px; 
            height: 300px; 
            border-radius: 50%;
            background: var(--bg); 
            z-index: 400; 
            box-shadow: 8px 8px 22px var(--shadow-dark), -8px -8px 22px var(--shadow-light);
            display: grid; place-items: center;
            overflow: hidden; cursor: ns-resize;
            transition: box-shadow 0.4s ease;
        }

        /* DRUM 3D */
        .drum-viewport {
            width: 100%; height: 100%; perspective: 1200px; position: relative;
            display: flex; justify-content: center; align-items: center;
            mask-image: linear-gradient(to bottom, transparent 20%, rgba(0,0,0,0.15) 35%, black 45%, black 55%, rgba(0,0,0,0.15) 65%, transparent 80%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 20%, rgba(0,0,0,0.15) 35%, black 45%, black 55%, rgba(0,0,0,0.15) 65%, transparent 80%);
            opacity: 0; transition: opacity 0.5s;
        }
        .drum-wheel { width: 100%; height: 45px; position: relative; transform-style: preserve-3d; will-change: transform; }
        .drum-item {
            position: absolute; width: 100%; height: 45px; top: 50%; margin-top: -22.5px; 
            line-height: 45px; text-align: center; 
            font-weight: 900; font-size: 28px; 
            color: var(--text-dark);
            backface-visibility: hidden;
        }

        .status-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }
        .is-roulette .status-svg { opacity: 1; }
        
        .status-svg text {
            font-size: 13px; font-weight: 800; letter-spacing: 2px;
            fill: var(--text-soft); text-transform: uppercase;
            transition: fill 0.3s, font-size 0.3s;
        }

        /* RELÓGIO UI */
        .clock-ui { position: absolute; width: 100%; height: 100%; transition: opacity 0.5s; pointer-events: none;}
        .hand { position: absolute; left: 50%; bottom: 50%; transform-origin: bottom center; border-radius: 4px; }
        .hand-h { width: 10px; height: 90px; margin-left: -5px; background-color: var(--text-dark); } 
        .hand-m { width: 6px; height: 200px; margin-left: -3px; background-color: var(--text-dark); }
        .center-dot { position:absolute; top:50%; left:50%; width:18px; height:18px; background:var(--text-dark); border-radius:50%; transform:translate(-50%,-50%); z-index: 10; }

        /* MARCADORES E LABELS */
        .clock-markers-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; transition: opacity 0.5s; z-index: 20; }
        .clock-tick {
            position: absolute; background-color: var(--text-soft); border-radius: 2px;
            width: 4px; height: 12px; left: 50%; top: 5px; margin-left: -2px; transform-origin: 50% 225px; 
        }
        .track-frets { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 5; opacity: 0; transition: 0.5s; }
        .fret { position: absolute; width: 2px; height: 100%; left: 50%; top: 0; margin-left: -1px; }
        .fret::after { content: ''; position: absolute; top: 6px; left: 0; width: 2px; height: 35px; background: var(--fret); border-radius: 2px; }
        .roulette-ui { position: absolute; width: 100%; height: 100%; opacity: 0; transition: 0.5s; z-index: 20; pointer-events: none; }
        .pin { position: absolute; width: 1px; height: 8px; background: #cbd1d8; left: 50%; margin-left: -0.5px; top: 2px; transform-origin: 50% 228px; }
        .label { 
            position: absolute; width: 30px; text-align: center; font-size: 16px; 
            font-weight: 700; color: var(--text-soft); opacity: 1;
            left: 50%; margin-left: -15px; top: 10px; transform-origin: 50% 220px;
        }

        /* --- GLOW MODERNO APENAS NO CÍRCULO EXTERIOR --- */
        .glow-win { box-shadow: 0 0 0 2px var(--win), 0 0 35px 2px rgba(0, 202, 133, 0.3) !important; }
        .glow-lose { box-shadow: 0 0 0 2px var(--lose), 0 0 35px 2px rgba(255, 23, 68, 0.3) !important; }

        .hub-win .status-svg text { fill: var(--win); font-size: 14px; }
        .hub-lose .status-svg text { fill: var(--lose); }

        .is-roulette .roulette-ui, .is-roulette .drum-viewport, .is-roulette .track-frets { opacity: 1; }
        .is-roulette .clock-ui, .is-roulette .clock-markers-layer { opacity: 0; }
        
        .status-container { height: 20px; display: flex; justify-content: center; align-items: center; width: 100%; margin-top: 15px;}
        #status-text {
            font-weight: 700; color: var(--text-soft); text-transform: uppercase; 
            font-size: 0.8rem; letter-spacing: 2px; transition: all 0.3s; text-align: center;
        }

        /* --- CONTROLS SWITCH --- */
        .controls-container {
            margin-top: 35px; 
            z-index: 1000; display: flex; align-items: center; justify-content: center; gap: 20px; 
        }
        .icon-svg { width: 26px; height: 26px; fill: var(--text-soft); transition: all 0.3s ease; cursor: pointer; }
        .icon-svg.active { fill: var(--text-dark); filter: drop-shadow(0 0 5px rgba(69,79,84,0.1)); transform: scale(1.1); }

        .custom-switch {
            position: relative; width: 110px; height: 44px; background: var(--bg); border-radius: 22px; 
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            cursor: pointer; overflow: hidden; padding: 0; display: flex; touch-action: none; 
        }
        .custom-switch input { display: none; }
        .slider-pill {
            position: absolute; top: 0; left: 0; width: 50%; height: 100%; background: #e6e9ef;
            border-radius: 22px; transition: all 0.3s cubic-bezier(0.45, 0.05, 0.55, 0.95);
            box-shadow: 2px 2px 6px rgba(163, 177, 198, 0.4), -2px -2px 6px rgba(255, 255, 255, 0.8); z-index: 2; pointer-events: none; 
        }
        input:checked ~ .slider-pill {
            transform: translateX(100%); background: #f0f0f3;
            box-shadow: 4px 0 15px var(--accent), 2px 2px 5px rgba(163, 177, 198, 0.4), -2px -2px 5px rgba(255, 255, 255, 0.8);
        }

        /* --- REDES SOCIAIS PREMIUM (LARGURA TOTAL 368px) --- */
        .social-container {
            display: flex; justify-content: center; align-items: center;
            gap: 40px; 
            margin-top: 35px; z-index: 1000;
        }

        .social-btn {
            position: relative;
            width: 96px;  
            height: 96px;
            border-radius: 30px; 
            background: var(--bg);
            box-shadow: 
                inset 5px 5px 12px var(--shadow-dark),
                inset -5px -5px 12px var(--shadow-light);
            display: flex; justify-content: center; align-items: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95);
            overflow: hidden;
        }

        .social-btn::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0; transition: all 0.4s ease; z-index: 1;
        }

        .social-icon {
            position: relative; z-index: 2;
            width: 48px; 
            height: 48px;
            fill: var(--text-dark); 
            transition: all 0.4s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .social-btn:hover { transform: translateY(-6px) scale(1.02); }
        .social-btn:hover .social-icon { fill: #ffffff; transform: scale(1.15); }

        .social-btn.insta:hover { box-shadow: 10px 10px 22px var(--shadow-dark), -10px -10px 22px var(--shadow-light), 0 18px 35px rgba(225, 48, 108, 0.4); }
        .social-btn.insta:hover::before { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); opacity: 1; }

        .social-btn.behance:hover { box-shadow: 10px 10px 22px var(--shadow-dark), -10px -10px 22px var(--shadow-light), 0 18px 35px rgba(23, 105, 255, 0.4); }
        .social-btn.behance:hover::before { background: #1769ff; opacity: 1; }

        .social-btn.whatsapp:hover { box-shadow: 10px 10px 22px var(--shadow-dark), -10px -10px 22px var(--shadow-light), 0 18px 35px rgba(37, 211, 102, 0.4); }
        .social-btn.whatsapp:hover::before { background: #25D366; opacity: 1; }

        .social-btn:active {
            transform: translateY(0) scale(0.95);
            box-shadow: inset 8px 8px 18px rgba(69,79,84,0.15), inset -8px -8px 18px rgba(255,255,255,0.2);
        }

    </style>
</head>

                    <path d="m55.95,79.29c.02-8.17,3.23-14.89,9.29-20.28,3.08-2.74,9.2-3.43,12.68-1.21,1.25.8,2.44,2.16,2.99,3.52,2.39,5.95,4.61,11.97,6.71,18.03.38,1.1.28,2.74-.29,3.72-1.14,1.96-2.68,3.73-4.2,5.43-4.06,4.54-4.13,5.16-1.01,10.39,6.57,11,15.71,19.19,27.1,24.94.83.42,1.7.77,2.59,1.04,1.89.59,3.52.28,4.87-1.34,2.35-2.82,4.82-5.54,7.19-8.34,1.4-1.66,2.41-2.1,4.46-1.25,2.27.94,4.48,2.07,6.66,3.21,4.08,2.13,8.1,4.39,12.2,6.48,1.87.95,2.63,2.28,2.41,4.35-.98,9.23-3.44,13.73-14.39,18.13-5.81,2.34-11.73,1.58-17.58-.21-21.58-6.6-38.17-19.69-50.37-38.55-3.57-5.52-7.43-10.91-9.35-17.3-1.05-3.49-1.63-7.11-2.43-10.68.16-.03.32-.07.48-.1Z"/>

    </div> 
    
    <script>
        // --- PREVENIR SCROLL E INSPECIONAR ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 67))) {
                e.preventDefault(); return false;
            }
        });

        // --- RESPONSIVIDADE AUTOMÁTICA ---
        function resizeApp() {
            const scale = Math.min(1, window.innerWidth / 500, window.innerHeight / 1000);
            document.documentElement.style.setProperty('--scale', scale);
        }
        window.addEventListener('resize', resizeApp);
        resizeApp();

        // --- LÓGICA CORE ---
        const drumWheel = document.getElementById('drumWheel');
        const rUI = document.getElementById('rouletteUI');
        const trackFrets = document.getElementById('trackFrets');
        const clockMarkers = document.getElementById('clockMarkers');
        const modeToggle = document.getElementById('modeToggle');
        const stage = document.getElementById('mainStage');
        const ballLayer = document.getElementById('ballLayer');
        const ballVisual = document.getElementById('ballVisual');
        const centerHub = document.getElementById('centerHub');
        
        const statusTextPath = document.getElementById('statusTextPath');
        const titleSvg = document.getElementById('titleSvg');
        
        const iconClock = document.getElementById('iconClock');
        const iconRoulette = document.getElementById('iconRoulette');
        const switchContainer = document.getElementById('switchContainer');

        const ROULETTE_NUMBERS = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const TOTAL_SLOTS = 37;
        const DEG_PER_SLOT = 360 / TOTAL_SLOTS;

        const DRUM_RADIUS = 310; 
        
        for(let i = 0; i < TOTAL_SLOTS; i++){
            let num = ROULETTE_NUMBERS[i];
            let angle = i * DEG_PER_SLOT;

            let fret = document.createElement('div'); fret.className='fret';
            fret.style.transform=`rotate(${angle + (DEG_PER_SLOT/2)}deg)`;
            trackFrets.appendChild(fret);
            
            let p = document.createElement('div'); p.className='pin'; 
            p.style.transform=`rotate(${angle + (DEG_PER_SLOT/2)}deg)`;
            rUI.appendChild(p);
            
            let l = document.createElement('div'); l.className='label'; 
            l.innerText=num; 
            l.style.transform=`rotate(${angle}deg)`;
            rUI.appendChild(l);
            
            let dn = document.createElement('div'); dn.className='drum-item';
            dn.innerText = num; 
            dn.style.transform = `rotateX(${-angle}deg) translateZ(${DRUM_RADIUS}px)`;
            drumWheel.appendChild(dn);
        }

        for(let j=0; j<12; j++){
            let tick = document.createElement('div'); tick.className = 'clock-tick';
            tick.style.transform = `rotate(${j * 30}deg)`;
            clockMarkers.appendChild(tick);
        }

        let isRoulette = false, dragBall = false, ballAngle = 0, ballVel = 0, clockOffset = 0, lastMouseAngle = 0;
        let dragDrum = false, drumAngle = 0, selectedNum = 0, lastMouseY = 0, isSpinning = false;
        let lastLayerRotation = 0;

        const initDate = new Date();
        const startRealTimeSec = (initDate.getHours() * 3600) + (initDate.getMinutes() * 60) + initDate.getSeconds() + (initDate.getMilliseconds() / 1000);
        const startPerf = performance.now();

        function animate(timestamp) {
            if (!timestamp) timestamp = performance.now();
            const realTimeSec = startRealTimeSec + ((timestamp - startPerf) / 1000);
            let layerRotation = 0, rattle = 0;

            if (!isRoulette) {
                if (!dragBall) { 
                    ballVel += -clockOffset * 0.08; ballVel *= 0.90; clockOffset += ballVel; 
                    if(Math.abs(clockOffset) < 0.001 && Math.abs(ballVel) < 0.001) { clockOffset = 0; ballVel = 0; }
                } else {
                    ballVel *= 0.8; 
                }
                const totalTime = realTimeSec + clockOffset;
                layerRotation = totalTime * 6;
                ballLayer.style.transform = `rotate(${layerRotation}deg)`;
                document.getElementById('hHand').style.transform = `rotate(${totalTime / 120}deg)`;
                document.getElementById('mHand').style.transform = `rotate(${totalTime * 0.1}deg)`;
            } else {
                if (!dragBall && isSpinning) {
                    ballAngle += ballVel; ballVel *= 0.985;
                    
                    let mod = Math.abs(ballAngle % DEG_PER_SLOT);
                    if(Math.abs(ballVel)>0.1 && (mod > (DEG_PER_SLOT*0.35) && mod < (DEG_PER_SLOT*0.65))) { rattle = (Math.random()-0.5)*Math.abs(ballVel)*2; }
                    
                    if (Math.abs(ballVel) < 0.3) { 
                        let nearestAngle = Math.round(ballAngle/DEG_PER_SLOT) * DEG_PER_SLOT;
                        ballVel += (nearestAngle - ballAngle) * 0.05; ballVel *= 0.92; 
                    }
                    if (Math.abs(ballVel) < 0.01 && Math.abs(ballAngle % DEG_PER_SLOT) < 0.5) { 
                        ballVel = 0; ballAngle = Math.round(ballAngle / DEG_PER_SLOT) * DEG_PER_SLOT; isSpinning = false; finishSpin(); 
                    }
                }
                layerRotation = ballAngle;
                ballLayer.style.transform = `rotate(${layerRotation}deg)`;
            }
            
            ballVisual.style.transform = `translateX(-50%) translateY(${rattle}px) rotate(${-layerRotation}deg)`;
            
            let deltaRotation = layerRotation - lastLayerRotation;
            if (deltaRotation > 180) deltaRotation -= 360;
            if (deltaRotation < -180) deltaRotation += 360;
            lastLayerRotation = layerRotation;

            let safeDelta = Math.max(-20, Math.min(20, deltaRotation));
            const speedMultiplier = isRoulette ? 1 : 1.5; 
            const speed = Math.abs(safeDelta) * speedMultiplier;
            const glitchIntensity = Math.min(speed, 10);

            if (glitchIntensity > 0.5) {
                const skew = safeDelta * (isRoulette ? -0.4 : -0.8);
                const split = glitchIntensity * 0.6;
                const shake = glitchIntensity > 7 ? (Math.random()*1.5 - 0.75) : 0;
                
                titleSvg.style.transform = `skewX(${skew}deg)`;
                titleSvg.style.filter = `
                    drop-shadow(${split}px ${shake}px 0px rgba(255, 71, 87, 0.8)) 
                    drop-shadow(-${split}px ${-shake}px 0px rgba(0, 202, 133, 0.8))
                `;
            } else {
                titleSvg.style.transform = `skewX(0deg)`;
                titleSvg.style.filter = `none`;
            }

            requestAnimationFrame(animate);
        }

        function finishSpin() {
            let normalizedAngle = (ballAngle % 360 + 360) % 360;
            let winningIndex = Math.round(normalizedAngle / DEG_PER_SLOT) % TOTAL_SLOTS;
            let result = ROULETTE_NUMBERS[winningIndex];

            ballVisual.style.transform = `translateX(-50%) rotate(${-ballAngle}deg)`; 
            
            if (result === selectedNum) {
                statusTextPath.textContent = "VITÓRIA! SAIU O " + result;
                centerHub.classList.add('hub-win');
                stage.classList.add('glow-win');
            } else {
                statusTextPath.textContent = "PERDESTE. SAIU O " + result;
                centerHub.classList.add('hub-lose');
                stage.classList.add('glow-lose');
            }
            setTimeout(() => {
                centerHub.classList.remove('hub-win', 'hub-lose');
                stage.classList.remove('glow-win', 'glow-lose');
                if(isRoulette) statusTextPath.textContent = "APOSTA: " + selectedNum;
            }, 3000);
        }

        function getAngle(x, y) {
            const rect = stage.getBoundingClientRect();
            const scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scale')) || 1;
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            return Math.atan2(y - cy, x - cx) * (180 / Math.PI) + 90;
        }

        const touchZone = document.getElementById('touchZone');
        touchZone.addEventListener('pointerdown', e => {
            dragBall = true; isSpinning = false;
            centerHub.classList.remove('hub-win', 'hub-lose');
            stage.classList.remove('glow-win', 'glow-lose');
            if(isRoulette) statusTextPath.textContent = "A RODAR...";
            lastMouseAngle = getAngle(e.clientX, e.clientY);
        });
        
        centerHub.addEventListener('pointerdown', e => {
            if (!isRoulette) return;
            dragDrum = true; lastMouseY = e.clientY;
            centerHub.classList.remove('hub-win', 'hub-lose');
            stage.classList.remove('glow-win', 'glow-lose');
        });

        window.addEventListener('pointermove', e => {
            if (dragBall) {
                let cur = getAngle(e.clientX, e.clientY), delta = cur - lastMouseAngle;
                if (delta < -180) delta += 360; if (delta > 180) delta -= 360;
                
                if (!isRoulette) { 
                    clockOffset += delta / 6; 
                    ballVel = delta; 
                } else { 
                    ballAngle += delta; ballVel = delta; 
                }
                lastMouseAngle = cur;
            }
            if (dragDrum) {
                const scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--scale')) || 1;
                drumAngle += ((lastMouseY - e.clientY) / scale) * 0.5; 
                lastMouseY = e.clientY;
                drumWheel.style.transform = `rotateX(${drumAngle}deg)`;
                
                let idx = Math.round(drumAngle / DEG_PER_SLOT);
                let normalizedIdx = ((idx % TOTAL_SLOTS) + TOTAL_SLOTS) % TOTAL_SLOTS;
                selectedNum = ROULETTE_NUMBERS[normalizedIdx];
                statusTextPath.textContent = "APOSTA: " + selectedNum;
            }
        });

        window.addEventListener('pointerup', () => {
            if (dragBall && isRoulette) isSpinning = true;
            if (dragDrum) {
                let snapIndex = Math.round(drumAngle / DEG_PER_SLOT);
                drumAngle = snapIndex * DEG_PER_SLOT;
                drumWheel.style.transition = "transform 0.2s ease-out";
                drumWheel.style.transform = `rotateX(${drumAngle}deg)`;
                setTimeout(() => drumWheel.style.transition = "none", 200);
            }
            dragBall = false; dragDrum = false;
        });

        function setMode(rouletteMode) {
            if (modeToggle.checked === rouletteMode) return;
            modeToggle.checked = rouletteMode;
            modeToggle.dispatchEvent(new Event('change'));
        }

        let dragStartX = 0, isDraggingSwitch = false, isSwitchMoved = false;

        switchContainer.addEventListener('pointerdown', e => {
            isDraggingSwitch = true; isSwitchMoved = false; dragStartX = e.clientX;
            switchContainer.setPointerCapture(e.pointerId);
        });
        switchContainer.addEventListener('pointermove', e => {
            if (!isDraggingSwitch) return;
            let deltaX = e.clientX - dragStartX;
            if (Math.abs(deltaX) > 5) isSwitchMoved = true;
            if (!modeToggle.checked && deltaX > 15) { setMode(true); isDraggingSwitch = false; } 
            else if (modeToggle.checked && deltaX < -15) { setMode(false); isDraggingSwitch = false; }
        });
        switchContainer.addEventListener('pointerup', e => {
            isDraggingSwitch = false;
            if (!isSwitchMoved) setMode(!modeToggle.checked);
            switchContainer.releasePointerCapture(e.pointerId);
        });

        modeToggle.addEventListener('change', e => {
            isRoulette = e.target.checked;
            stage.classList.toggle('is-roulette', isRoulette);
            
            if(isRoulette) { 
                iconRoulette.classList.add('active'); iconClock.classList.remove('active'); 
            } else { 
                iconClock.classList.add('active'); iconRoulette.classList.remove('active'); 
            }

            statusTextPath.textContent = isRoulette ? "ESCOLHE A TUA APOSTA!" : "";
            const currentRealTimeSec = startRealTimeSec + ((performance.now() - startPerf) / 1000);
            if (isRoulette) { 
                ballAngle = (currentRealTimeSec + clockOffset) * 6; ballVel = 0; 
            } else {
                clockOffset = ((ballAngle/6) - currentRealTimeSec) % 60;
                if (clockOffset > 30) clockOffset -= 60; if (clockOffset < -30) clockOffset += 60;
                ballVel = 0; centerHub.classList.remove('hub-win', 'hub-lose'); stage.classList.remove('glow-win', 'glow-lose'); 
            }
        });
        
        requestAnimationFrame(animate);
    </script>

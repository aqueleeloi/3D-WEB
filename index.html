    <style>
        :root {
            --bg: #F2F2F4;       /* Cinza muito suave premium */
            --text: #050505;     /* Preto quase absoluto */
            --white: #FFFFFF;
            --wheel-border: #000000;
            --tick-color: #000000;
            --ball-color: #FF4500; /* Laranja Internacional Vibrante */
        }

        /* --- RESET & IOS OTIMIZAÇÕES --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; outline: none;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            height: 100dvh; width: 100%; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 30px 20px;
        }

        /* HEADER */
        header { text-align: center; z-index: 10; pointer-events: none; }
        
        h1 { 
            font-size: 2.2rem; 
            font-weight: 800; 
            letter-spacing: -0.04em; 
            line-height: 1; 
            color: var(--text);
        }
        
        .badge {
            margin-top: 10px; display: inline-block; background: var(--white);
            border: 1px solid rgba(0,0,0,0.06); padding: 6px 16px; border-radius: 100px;
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            color: #444;
        }

        /* STAGE */
        .stage {
            position: relative; width: 290px; height: 290px;
            display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }

        /* Sombra Fixa Suave */
        .static-shadow {
            position: absolute; width: 92%; height: 92%; border-radius: 50%;
            background: transparent; box-shadow: 0 30px 70px rgba(0,0,0,0.12);
            z-index: 0; pointer-events: none;
        }

        /* --- A RODA BOLD & MINIMALISTA --- */
        .wheel {
            position: relative;
            width: 100%; height: 100%;
            background-color: rgba(255,255,255,0.01); /* Quase invisível para pegar o clique */
            border-radius: 50%;
            /* BORDA PRETA GROSSA (BOLD) */
            border: 8px solid var(--wheel-border);
            cursor: grab; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            transform: translateZ(0); /* Aceleração GPU */
        }
        .wheel:active { cursor: grabbing; }

        /* TICKS (ESTILO RELÓGIO SUAVE) */
        .tick {
            position: absolute;
            background-color: var(--tick-color);
            left: 50%; top: 50%;
            transform-origin: center center;
            pointer-events: none;
        }
        
        /* Ticks Principais (Horas) */
        .tick.major { 
            width: 2px; height: 12px; 
            margin-left: -1px; margin-top: -6px; /* Centrar */
            /* Posicionado via JS */
        }
        
        /* Ticks Secundários (Minutos) - SUAVES */
        .tick.minor { 
            width: 1px; height: 6px; 
            margin-left: -0.5px; margin-top: -3px;
            opacity: 0.3; /* Muito suave */
        }

        /* Área interna segura */
        .hollow {
            width: 100%; height: 100%;
            position: absolute; pointer-events: none;
        }

        /* --- A BOLA --- */
        .ball {
            position: absolute; width: 26px; height: 26px;
            background-color: var(--ball-color);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 4px 12px rgba(255, 69, 0, 0.35); /* Glow laranja sutil */
            pointer-events: none;
            top: 50%; left: 50%; margin-top: -13px; margin-left: -13px;
            will-change: transform;
        }

        /* --- LINKS --- */
        .menu { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        
        .card {
            background: var(--white); padding: 18px 24px; border-radius: 18px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--text); font-weight: 600;
            transition: transform 0.1s, box-shadow 0.2s; 
            border: 1px solid rgba(0,0,0,0.04);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        
        .card-left { display: flex; align-items: center; gap: 14px; }
        .card-icon { width: 22px; height: 22px; fill: currentColor; }
        .arrow-icon { opacity: 0.3; font-size: 1.2rem; transition: opacity 0.2s; }

        .card:active { transform: scale(0.97); background: #fafafa; }
        @media(hover: hover) {
            .card:hover { 
                background: var(--text); color: var(--white); transform: scale(1.01); 
                box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            }
            .card:hover .arrow-icon { opacity: 1; }
        }

        footer { font-size: 0.7rem; color: #999; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 10px; }
        
        #sound-hint {
            position: absolute; top: 80px; font-size: 0.65rem; color: #BBB; font-weight: 500;
            opacity: 0; transition: opacity 1s; pointer-events: none; left: 50%; transform: translateX(-50%);
        }

    </style>
</head>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');

        // --- GERADOR DE TICKS (DESIGN SUAVE) ---
        function generateTicks() {
            const numTicks = 60; // 60 segundos
            // O raio deve ser menor que a roda para ficar DENTRO da borda
            // Roda width = 290px / 2 = 145px. Borda = 8px. Espaço = 5px.
            // Raio dos ticks ~= 125px
            const radius = 125; 
            
            for (let i = 0; i < numTicks; i++) {
                const tick = document.createElement('div');
                const angle = (i / numTicks) * 360;
                
                tick.className = (i % 5 === 0) ? 'tick major' : 'tick minor';
                
                // Mágica de posicionamento: Transladar do centro para a borda
                tick.style.transform = `rotate(${angle}deg) translateY(-${radius}px)`;
                
                wheel.appendChild(tick);
            }
        }
        generateTicks();

        // --- SISTEMA DE SOM (IOS HAPTICS) ---
        let audioCtx = null;
        let isAudioUnlocked = false;

        function initAudio() {
            if (isAudioUnlocked) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                audioCtx = new AudioContext();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
                isAudioUnlocked = true;
                const hint = document.getElementById('sound-hint');
                hint.style.opacity = 1;
                setTimeout(() => hint.style.opacity = 0, 3000);
            }
        }

        function playClickSound() {
            if (!audioCtx || audioCtx.state === 'suspended') { if(audioCtx) audioCtx.resume(); return;}
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            
            // Som curto e suave de "relojoeiro"
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.03);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            
            osc.type = 'sine'; // Sine wave é mais suave que triangle
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        }

        // --- FÍSICA E INTERAÇÃO ---
        let wheelAngle = 0, isDragging = false, startAngle = 0, wheelVelocity = 0;
        let lastTickAngle = 0;
        const tickInterval = 30; // Graus para clique

        let ballX = 0, ballY = 0, ballVX = 0, ballVY = 0;
        const gravity = 0.5, friction = 0.985, bounce = 0.65;
        // Limite da bola: 145 (raio roda) - 8 (borda) - 13 (raio bola) ~= 124
        const boundary = 120; 

        function getAngle(x, y) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
        }

        function startDrag(e) {
            initAudio(); isDragging = true; wheelVelocity = 0;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startAngle = getAngle(clientX, clientY) - wheelAngle;
            wheel.style.cursor = 'grabbing';
        }

        function handleTick(currentAngle) {
            if (Math.abs(currentAngle - lastTickAngle) > tickInterval) {
                playClickSound();
                if (navigator.vibrate) navigator.vibrate(5);
                lastTickAngle = currentAngle;
            }
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); 
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            const angle = getAngle(clientX, clientY);
            let delta = (angle - startAngle) - wheelAngle;
            if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
            wheelVelocity = delta; wheelAngle += delta;
            wheel.style.transform = `rotate(${wheelAngle}deg)`;
            handleTick(wheelAngle);
        }

        function stopDrag() { isDragging = false; wheel.style.cursor = 'grab'; }

        function update() {
            if (!isDragging) {
                wheelVelocity *= 0.98; wheelAngle += wheelVelocity;
                wheel.style.transform = `rotate(${wheelAngle}deg)`;
                if (Math.abs(wheelVelocity) > 0.5) handleTick(wheelAngle); 
            }
            ballVY += gravity; ballX += ballVX; ballY += ballVY;
            const dist = Math.sqrt(ballX * ballX + ballY * ballY);
            if (dist > boundary) {
                const nx = ballX / dist, ny = ballY / dist;
                ballX = nx * boundary; ballY = ny * boundary;
                const dot = ballVX * nx + ballVY * ny;
                ballVX -= 2 * dot * nx; ballVY -= 2 * dot * ny;
                ballVX *= bounce; ballVY *= bounce;
                const spin = wheelVelocity * 0.8;
                ballVX += -ny * spin; ballVY += nx * spin;
            }
            ballVX *= friction; ballVY *= friction;
            ball.style.transform = `translate3d(${ballX}px, ${ballY}px, 0)`;
            requestAnimationFrame(update);
        }

        const passive = {passive: false};
        wheel.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);
        wheel.addEventListener('touchstart', startDrag, passive);
        window.addEventListener('touchmove', onDrag, passive);
        window.addEventListener('touchend', stopDrag);

        ballY = -40; // Bola começa no topo
        update();
    </script>

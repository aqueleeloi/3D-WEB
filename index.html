<!DOCTYPE html>

    <style>
        :root {
            --bg: #E0E0E0; /* Cinza cimento */
            --black: #000000;
            --white: #FFFFFF;
            --ball: #FF4500; /* Laranja Internacional */
        }

        /* --- RESET & IOS FIXES --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; outline: none;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            /* Padrão de grelha sutil no fundo para dar vibe técnica */
            background-image: radial-gradient(var(--black) 1px, transparent 1px);
            background-size: 20px 20px;
            
            font-family: 'Inter', sans-serif;
            color: var(--black);
            height: 100dvh; width: 100%; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 20px;
        }

        /* --- HEADER AGRESSIVO --- */
        header { 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            z-index: 10; 
            pointer-events: none;
            border-bottom: 4px solid var(--black);
            padding-bottom: 15px;
            background: var(--bg);
        }

        h1 { 
            font-size: 2.5rem; 
            font-weight: 900; 
            line-height: 0.9; 
            text-transform: uppercase; 
            letter-spacing: -2px;
        }

        .meta {
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
        }
        
        .badge {
            background: var(--black); color: var(--white);
            padding: 4px 8px; font-size: 0.7rem;
            display: inline-block; margin-top: 4px;
        }

        /* --- STAGE DA RODA --- */
        .stage {
            position: relative; width: 300px; height: 300px;
            display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }

        /* Sombra Sólida (Hard Shadow) */
        .static-shadow {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: rgba(0,0,0,0.2);
            transform: translate(10px, 10px); /* Deslocada para dar peso */
            z-index: 0; pointer-events: none;
        }

        /* RODA BRUTALISTA */
        .wheel {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 50%;
            /* BORDA SUPER GROSSA */
            border: 16px solid var(--black); 
            background: transparent;
            cursor: grab; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            transform: translateZ(0);
        }
        .wheel:active { cursor: grabbing; }

        /* Decoração Interna (Gira com a roda) */
        .wheel-decor {
            position: absolute; width: 100%; height: 100%;
            pointer-events: none;
        }
        
        /* Linhas em cruz */
        .cross-line {
            position: absolute; background: var(--black);
            left: 50%; top: 50%; transform: translate(-50%, -50%);
        }
        .cross-line.v { width: 2px; height: 100%; }
        .cross-line.h { width: 100%; height: 2px; }

        /* Letras Industriais */
        .compass {
            position: absolute; font-family: 'JetBrains Mono', monospace;
            font-weight: 900; font-size: 1.2rem; color: var(--black);
        }
        .compass.n { top: 10px; left: 50%; transform: translateX(-50%); }
        .compass.s { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .compass.w { left: 15px; top: 50%; transform: translateY(-50%); }
        .compass.e { right: 15px; top: 50%; transform: translateY(-50%); }

        /* Buraco */
        .hollow {
            width: 180px; height: 180px;
            border: 4px solid var(--black); /* Borda interna grossa */
            border-radius: 50%;
            background: var(--bg); /* Oculta as linhas de trás */
            position: relative; pointer-events: none; z-index: 3;
            display: flex; align-items: center; justify-content: center;
        }
        
        .center-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem; opacity: 0.5; text-align: center;
        }

        /* Ticks grossos */
        .tick {
            position: absolute; background: var(--black);
            width: 6px; height: 16px; 
            left: 50%; bottom: 100%; margin-left: -3px; margin-bottom: -10px;
            transform-origin: center 160px; /* Raio ajustado */
        }

        /* --- BOLA DESTAQUE --- */
        .ball {
            position: absolute; width: 36px; height: 36px;
            background-color: var(--ball);
            border: 3px solid var(--black); /* Outline preto na bola */
            border-radius: 50%;
            z-index: 5;
            /* Sombra dura na bola também */
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            pointer-events: none;
            top: 50%; left: 50%; margin-top: -18px; margin-left: -18px;
            will-change: transform;
        }

        /* --- LINKS --- */
        .menu { width: 100%; max-width: 500px; display: grid; gap: 12px; z-index: 10; padding-bottom: 20px;}
        
        .card {
            background: var(--white); 
            padding: 20px; 
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--black); 
            
            /* ESTILO BRUTALISTA NOS BOTÕES */
            border: 3px solid var(--black);
            box-shadow: 6px 6px 0px var(--black); /* Sombra dura deslocada */
            font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em;
            transition: all 0.1s;
            cursor: pointer;
        }

        .card-left { display: flex; align-items: center; gap: 15px; }
        .card-icon { width: 24px; height: 24px; fill: var(--black); }

        .card:active {
            transform: translate(4px, 4px); /* Botão afunda fisicamente */
            box-shadow: 2px 2px 0px var(--black);
        }

        @media(hover: hover) {
            .card:hover {
                background: var(--black); color: var(--white);
            }
            .card:hover .card-icon { fill: var(--white); }
        }

        /* Sound Hint escondido */
        #sound-hint { position: absolute; opacity: 0; pointer-events: none; }

    </style>
</head>
<body>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');

        // --- HAPTICS / AUDIO (Heavy Clunk) ---
        let audioCtx = null;
        let isAudioUnlocked = false;

        function initAudio() {
            if (isAudioUnlocked) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                audioCtx = new AudioContext();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
                isAudioUnlocked = true;
            }
        }

        function playClunk() {
            if (!audioCtx || audioCtx.state === 'suspended') { if(audioCtx) audioCtx.resume(); return;}
            
            // Som mais grave e mecânico para combinar com o design brutalista
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            
            // Frequência mais baixa (som de engrenagem pesada)
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);
            
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            
            osc.type = 'sawtooth'; // Onda dente de serra é mais "áspera"
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        // --- FÍSICA ---
        let wheelAngle = 0, isDragging = false, startAngle = 0, wheelVelocity = 0;
        let lastTickAngle = 0;
        const tickInterval = 20; // Mais cliques porque é mais pesado

        let ballX = 0, ballY = 0, ballVX = 0, ballVY = 0;
        const gravity = 0.6, friction = 0.98, bounce = 0.6; // Gravidade mais forte
        const boundary = 72; 

        function getAngle(x, y) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
        }

        function startDrag(e) {
            initAudio(); isDragging = true; wheelVelocity = 0;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startAngle = getAngle(clientX, clientY) - wheelAngle;
            wheel.style.cursor = 'grabbing';
        }

        function handleTick(currentAngle) {
            if (Math.abs(currentAngle - lastTickAngle) > tickInterval) {
                playClunk();
                if (navigator.vibrate) navigator.vibrate(10); // Vibração mais forte
                lastTickAngle = currentAngle;
            }
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); 
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            const angle = getAngle(clientX, clientY);
            let delta = (angle - startAngle) - wheelAngle;
            if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
            wheelVelocity = delta; wheelAngle += delta;
            wheel.style.transform = `rotate(${wheelAngle}deg)`;
            handleTick(wheelAngle);
        }

        function stopDrag() { isDragging = false; wheel.style.cursor = 'grab'; }

        function update() {
            if (!isDragging) {
                wheelVelocity *= 0.97; // Desacelera mais rápido (mais peso)
                wheelAngle += wheelVelocity;
                wheel.style.transform = `rotate(${wheelAngle}deg)`;
                if (Math.abs(wheelVelocity) > 0.5) handleTick(wheelAngle); 
            }
            ballVY += gravity; ballX += ballVX; ballY += ballVY;
            const dist = Math.sqrt(ballX * ballX + ballY * ballY);
            if (dist > boundary) {
                const nx = ballX / dist, ny = ballY / dist;
                ballX = nx * boundary; ballY = ny * boundary;
                const dot = ballVX * nx + ballVY * ny;
                ballVX -= 2 * dot * nx; ballVY -= 2 * dot * ny;
                ballVX *= bounce; ballVY *= bounce;
                const spin = wheelVelocity * 0.9;
                ballVX += -ny * spin; ballVY += nx * spin;
            }
            ballVX *= friction; ballVY *= friction;
            ball.style.transform = `translate3d(${ballX}px, ${ballY}px, 0)`;
            requestAnimationFrame(update);
        }

        const passive = {passive: false};
        wheel.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);
        wheel.addEventListener('touchstart', startDrag, passive);
        window.addEventListener('touchmove', onDrag, passive);
        window.addEventListener('touchend', stopDrag);

        ballY = -30;
        update();
    </script>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eloi Silva | Kinetic Reactor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #EAEAEB;
            --text: #111111;
            --white: #FFFFFF;
            --accent: #FF3300; /* Laranja Internacional */
            --glow: #FF5500;
        }

        /* RESET & LOCK SCROLL */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; }

        body {
            background-color: var(--bg);
            /* Grelha técnica subtil no fundo */
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 40px 24px 30px 24px;
        }

        /* --- HEADER TÉCNICO --- */
        header { 
            text-align: center; z-index: 10; pointer-events: none; width: 100%;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        h1 {
            font-size: 3rem; font-weight: 900; text-transform: uppercase;
            letter-spacing: -0.05em; line-height: 0.9; margin: 0;
            color: var(--text);
        }

        .status-bar {
            display: flex; gap: 15px; font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem; color: #888; letter-spacing: 0.1em;
            border: 1px solid rgba(0,0,0,0.1); padding: 6px 12px; border-radius: 4px;
            background: rgba(255,255,255,0.5); backdrop-filter: blur(5px);
        }
        .status-dot { width: 6px; height: 6px; background: #ccc; border-radius: 50%; display: inline-block; }
        .status-dot.active { background: var(--accent); box-shadow: 0 0 5px var(--accent); }

        /* --- STAGE (REACTOR) --- */
        .stage { 
            position: relative; width: 320px; height: 320px; 
            display: flex; align-items: center; justify-content: center; 
            /* Perspetiva para dar profundidade ao mecanismo */
            perspective: 1000px;
        }

        /* Container que segura tudo */
        .reactor-container {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            cursor: grab;
        }
        .reactor-container:active { cursor: grabbing; }

        /* Sombra estática no chão */
        .shadow-floor {
            position: absolute; width: 80%; height: 80%; top: 10%; left: 10%;
            border-radius: 50%; background: transparent;
            box-shadow: 0 50px 100px rgba(0,0,0,0.2);
            transform: translateZ(-100px); pointer-events: none;
        }

        /* --- ANÉIS DA TURBINA --- */
        .ring {
            position: absolute; border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
            will-change: transform, border-color, box-shadow;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Anel Externo (Pega) */
        .ring-outer {
            width: 100%; height: 100%;
            border: 16px solid #1a1a1a; /* Borda grossa */
            /* Textura de "Pega" */
            background: repeating-conic-gradient(
                from 0deg, 
                transparent 0deg 2deg, 
                rgba(255,255,255,0.05) 2deg 4deg
            );
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Anel Médio (Detalhes Técnicos) */
        .ring-mid {
            width: 82%; height: 82%;
            border: 2px dashed #999;
            z-index: 5;
        }

        /* Anel Interno (O Núcleo) */
        .ring-inner {
            width: 65%; height: 65%;
            border: 4px solid #ddd;
            border-left-color: transparent; border-right-color: transparent; /* Aberturas */
            z-index: 6;
        }

        /* --- INTERFACE DE DADOS CENTRAL --- */
        .core-display {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%) translateZ(20px);
            text-align: center; pointer-events: none; z-index: 20;
        }

        .rpm-value {
            font-family: 'Inter', sans-serif;
            font-weight: 900; font-size: 2.5rem;
            font-feature-settings: "tnum"; /* Números tabulares para não saltar */
            color: var(--text);
            line-height: 1;
            transition: color 0.1s;
        }

        .rpm-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem; color: #888;
            letter-spacing: 0.2em; margin-top: 5px;
        }

        /* --- ESTADOS DE ENERGIA (Ativados via JS) --- */
        /* Nível 1: Ativo */
        .reactor-container.active .ring-mid { border-color: #555; }
        
        /* Nível 2: Alta Velocidade (Laranja) */
        .reactor-container.hot .ring-outer { border-color: #333; }
        .reactor-container.hot .ring-inner { border-color: var(--accent); box-shadow: 0 0 15px rgba(255, 51, 0, 0.4); }
        .reactor-container.hot .rpm-value { color: var(--accent); }

        /* Nível 3: Velocidade Máxima (Branco/Plasma) */
        .reactor-container.super .ring-outer { border-color: #000; }
        .reactor-container.super .ring-inner { 
            border-color: #fff; box-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent); 
            background: rgba(255, 51, 0, 0.1);
        }
        .reactor-container.super .rpm-value { color: #fff; text-shadow: 0 0 20px var(--accent); }


        /* --- LINKS MINIMALISTAS (Estilo Aprovado) --- */
        .menu { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; z-index: 20; transform: translateZ(50px); }
        
        .card {
            background: var(--white); padding: 18px 25px; border-radius: 18px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--text); font-weight: 600;
            transition: all 0.2s ease-out; 
            border: 1px solid rgba(0,0,0,0.04); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        
        .card-left { display: flex; align-items: center; gap: 14px; }
        .card-icon { width: 22px; height: 22px; fill: currentColor; }
        
        .card:active { transform: scale(0.98); background: #fafafa; }
        @media(hover: hover) {
            .card:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(0,0,0,0.08);
                color: #000;
            }
        }

        footer { font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; margin-top: 10px;}

    </style>
</head>
<body>

    <script>
        const reactor = document.getElementById('reactor');
        const ringOuter = document.getElementById('ring-outer');
        const ringMid = document.getElementById('ring-mid');
        const ringInner = document.getElementById('ring-inner');
        const rpmText = document.getElementById('rpm-text');
        const dotAudio = document.getElementById('dot-audio');

        // AUDIO ENGINE (Turbine Sound)
        let audioCtx = null;
        let humOsc = null;
        let humGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dotAudio.classList.add('active'); // Visual feedback de som ativo
            
            // Setup Hum continuo
            humOsc = audioCtx.createOscillator();
            humGain = audioCtx.createGain();
            
            humOsc.connect(humGain);
            humGain.connect(audioCtx.destination);
            
            humOsc.type = 'sawtooth'; // Som mais mecânico/motor
            // Frequência base baixa (idle)
            humOsc.frequency.value = 40; 
            // Volume base muito baixo
            humGain.gain.value = 0; 
            
            humOsc.start();
        }

        function updateAudio(speed) {
            if (!audioCtx) return;
            
            // Mapear velocidade (0-100) para Frequência (40Hz - 200Hz)
            const targetFreq = 40 + (speed * 4);
            const targetVol = Math.min(speed * 0.005, 0.1); // Volume sobe com velocidade
            
            // Transições suaves para não haver cliques no audio
            humOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
            humGain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.1);
        }

        // FÍSICA INOVADORA (FLYWHEEL)
        let angle = 0;
        let velocity = 0;
        let isDragging = false;
        let startAngle = 0;
        let currentRPM = 0;

        // Anéis internos rodam a velocidades diferentes (Parallax/Mechanism feel)
        let angleMid = 0;
        let angleInner = 0;

        function getAngle(x, y) {
            const rect = reactor.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            return Math.atan2(y - cy, x - cx) * 180 / Math.PI;
        }

        function start(e) {
            initAudio();
            isDragging = true;
            // Se já estiver a rodar, mantemos a velocidade, mas permitimos adicionar mais
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            startAngle = getAngle(cx, cy) - angle;
            
            // Efeito visual de "agarra"
            reactor.style.transform = `scale(0.98)`;
        }

        function move(e) {
            if (!isDragging) return;
            e.preventDefault();
            const cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            const newAngle = getAngle(cx, cy);
            let delta = (newAngle - startAngle) - angle;
            
            // Normalizar rotação
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            
            // Adicionar energia à roda (Input direto)
            velocity = delta; 
            angle += velocity;
        }

        function end() {
            isDragging = false;
            reactor.style.transform = `scale(1)`;
        }

        function loop() {
            // Física de Inércia (Baixa fricção para longos spins)
            if (!isDragging) {
                velocity *= 0.992; // Fricção muito baixa (High Precision Bearing)
                angle += velocity;
            }

            // Calcular RPM aproximado (Velocidade por frame * 60 frames * fator)
            const targetRPM = Math.abs(velocity * 100);
            // Suavizar leitura do RPM
            currentRPM += (targetRPM - currentRPM) * 0.1;
            rpmText.innerText = Math.round(currentRPM);

            // Atualizar Audio
            updateAudio(Math.abs(currentRPM));

            // Rotação dos Anéis (Mecanismo complexo)
            // Outer: Segue a física direta
            ringOuter.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
            
            // Mid: Roda um pouco mais devagar (Drag)
            angleMid += velocity * 0.8;
            ringMid.style.transform = `translate(-50%, -50%) rotate(${angleMid}deg)`;
            
            // Inner: Contra-rotação ou rotação rápida (Turbine)
            angleInner += velocity * 1.5; // Mais rápido
            ringInner.style.transform = `translate(-50%, -50%) rotate(${angleInner}deg)`;

            // GESTÃO DE ESTADOS DE ENERGIA (Cor e Brilho)
            // Limpar classes
            reactor.classList.remove('active', 'hot', 'super');

            if (currentRPM > 10) {
                reactor.classList.add('active');
            }
            if (currentRPM > 300) {
                reactor.classList.add('hot');
            }
            if (currentRPM > 800) {
                reactor.classList.add('super');
                // Vibração no dispositivo se suportado (apenas em alta velocidade)
                if (navigator.vibrate && Math.random() > 0.8) navigator.vibrate(5);
            }

            requestAnimationFrame(loop);
        }

        // Listeners
        const p = {passive: false};
        reactor.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        reactor.addEventListener('touchstart', start, p);
        window.addEventListener('touchmove', move, p);
        window.addEventListener('touchend', end);

        loop();
    </script>

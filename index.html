<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eloi Silva | Visual Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0E0E0E;
            --surface: #1A1A1A;
            --text: #FFFFFF;
            --accent: #FF4500; /* Laranja Internacional */
            --dim: #444;
        }

        /* RESET & NO SCROLL */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; }

        body {
            background-color: var(--bg);
            /* Padrão de grelha subtil */
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 40px 24px 30px 24px;
        }

        /* --- HEADER --- */
        header { text-align: center; z-index: 10; pointer-events: none; width: 100%; }

        h1 {
            font-size: 2.5rem; font-weight: 900; text-transform: uppercase;
            letter-spacing: -0.04em; line-height: 1; margin: 0;
            background: linear-gradient(to bottom, #fff, #999);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .role {
            margin-top: 8px; font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem; color: var(--accent); letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* --- STAGE (O REACTOR) --- */
        .stage { 
            position: relative; width: 280px; height: 280px; 
            display: flex; align-items: center; justify-content: center; 
        }

        /* Container da Roda */
        .reactor {
            position: relative; width: 100%; height: 100%;
            border-radius: 50%;
            cursor: grab;
        }
        .reactor:active { cursor: grabbing; }

        /* Anel Externo (Estático visualmente, mas roda via JS) */
        .ring-outer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid #333;
            /* Marcas industriais */
            background: repeating-conic-gradient(
                from 0deg, 
                transparent 0deg 4deg, 
                #222 4deg 5deg
            );
            box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Anel Interno (Acento) */
        .ring-inner {
            position: absolute; top: 15%; left: 15%; width: 70%; height: 70%;
            border-radius: 50%;
            border: 1px dashed #555;
        }

        /* Núcleo (Dados) */
        .core {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px; background: var(--bg); border-radius: 50%;
            border: 2px solid #333;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .rpm-val { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: var(--white); font-weight: 700; }
        .rpm-lbl { font-size: 0.5rem; color: #666; letter-spacing: 0.1em; margin-top: 2px; }

        /* Indicador de Rotação (Pequeno triângulo) */
        .marker {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-bottom: 10px solid var(--accent);
        }

        /* --- LINKS (ACESSO IMEDIATO) --- */
        .menu { 
            width: 100%; max-width: 400px; 
            display: flex; flex-direction: column; gap: 12px; 
            z-index: 20; 
        }
        
        .card {
            background: var(--surface); padding: 18px 24px; border-radius: 12px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: #ccc; font-weight: 600;
            transition: all 0.2s ease-out; 
            border: 1px solid #333;
        }
        
        .card-left { display: flex; align-items: center; gap: 14px; }
        .card-icon { width: 20px; height: 20px; fill: currentColor; transition: fill 0.2s; }
        .arrow { color: #555; transition: color 0.2s, transform 0.2s; }
        
        .card:active { transform: scale(0.98); background: #222; border-color: #555; color: #fff; }
        
        /* Hover Effects */
        @media(hover: hover) {
            .card:hover {
                background: #252525; border-color: var(--accent); color: #fff;
                transform: translateY(-2px);
            }
            .card:hover .card-icon { fill: var(--accent); }
            .card:hover .arrow { color: var(--accent); transform: translateX(4px); }
        }

        footer { font-size: 0.65rem; color: #444; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 10px; }
        
        /* Sound Hint */
        #hint { position: absolute; top: 120px; font-size: 0.6rem; color: #444; letter-spacing: 1px; opacity: 0; transition: opacity 1s; }

    </style>
</head>
<body>

    <script>
        const reactor = document.getElementById('reactor');
        const rpmText = document.getElementById('rpm');
        const outerRing = document.querySelector('.ring-outer');
        const innerRing = document.querySelector('.ring-inner');

        // AUDIO ENGINE
        let audioCtx = null;
        let osc = null;
        let gain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('hint').style.opacity = 1;
            setTimeout(() => document.getElementById('hint').style.opacity = 0, 3000);

            osc = audioCtx.createOscillator();
            gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            // Som de turbina suave
            osc.type = 'sawtooth';
            osc.frequency.value = 50;
            gain.gain.value = 0;
            osc.start();
        }

        function updateAudio(speed) {
            if (!audioCtx) return;
            // Som sobe de tom e volume com a velocidade
            const targetPitch = 50 + (speed * 3);
            const targetVol = Math.min(speed * 0.002, 0.08);
            
            osc.frequency.setTargetAtTime(targetPitch, audioCtx.currentTime, 0.1);
            gain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.1);
        }

        // FÍSICA DE INÉRCIA (FLYWHEEL)
        let angle = 0;
        let velocity = 0;
        let isDragging = false;
        let startAngle = 0;
        let currentRPM = 0;

        function getAngle(x, y) {
            const rect = reactor.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;
            return Math.atan2(y - cy, x - cx) * 180 / Math.PI;
        }

        function start(e) {
            initAudio();
            isDragging = true;
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            startAngle = getAngle(cx, cy) - angle;
            reactor.style.cursor = 'grabbing';
        }

        function move(e) {
            if (!isDragging) return;
            e.preventDefault();
            const cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            
            const newAngle = getAngle(cx, cy);
            let delta = (newAngle - startAngle) - angle;
            
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;
            
            velocity = delta; 
            angle += velocity;
        }

        function end() {
            isDragging = false;
            reactor.style.cursor = 'grab';
        }

        function loop() {
            if (!isDragging) {
                velocity *= 0.99; // Inércia longa e satisfatória
                angle += velocity;
            }

            // Atualizar RPM
            const rpm = Math.abs(velocity * 60);
            currentRPM += (rpm - currentRPM) * 0.1; // Suavizar números
            rpmText.innerText = Math.round(currentRPM);

            // Atualizar Áudio
            updateAudio(Math.abs(currentRPM));

            // Rotação Visual
            outerRing.style.transform = `rotate(${angle}deg)`;
            // Anel interno roda ao contrário para efeito mecânico
            innerRing.style.transform = `rotate(${-angle * 0.5}deg)`;

            // Cor Dinâmica (Aquece com a velocidade)
            if (currentRPM > 500) {
                rpmText.style.color = 'var(--accent)';
                rpmText.style.textShadow = '0 0 10px var(--accent)';
            } else {
                rpmText.style.color = '#fff';
                rpmText.style.textShadow = 'none';
            }

            requestAnimationFrame(loop);
        }

        const p = {passive: false};
        reactor.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        reactor.addEventListener('touchstart', start, p);
        window.addEventListener('touchmove', move, p);
        window.addEventListener('touchend', end);

        loop();
    </script>

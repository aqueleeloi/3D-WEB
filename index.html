    <style>
        :root {
            --bg: #F5F5F7;
            --text: #000000;
            --white: #FFFFFF;
            --wheel-border: #000000;
            --ball-color: #FF4500;
        }

        /* --- IOS & MOBILE RESET --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; outline: none;
            -webkit-user-select: none; user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            height: 100dvh; width: 100%; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 40px 24px 30px 24px;
        }

        /* --- TITULO ESTÉTICO REFEITO --- */
        header { 
            text-align: center; 
            z-index: 10; 
            pointer-events: none;
        }

        .brand-name {
            font-size: 2.8rem;
            line-height: 0.9;
            letter-spacing: -0.06em;
            text-transform: uppercase;
        }

        .brand-name span {
            font-weight: 900;
            display: block;
        }

        .brand-name em {
            font-style: normal;
            font-weight: 200;
            display: block;
            color: #666;
        }

        .badge {
            margin-top: 15px;
            display: inline-block;
            background: var(--white);
            border: 1px solid rgba(0,0,0,0.08);
            padding: 5px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #888;
            letter-spacing: 0.05em;
        }

        /* --- STAGE RODA --- */
        .stage {
            position: relative; width: 280px; height: 280px;
            display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }

        .static-shadow {
            position: absolute; width: 90%; height: 90%; border-radius: 50%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.12); z-index: 0;
        }

        .wheel {
            position: relative;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 12px solid var(--wheel-border);
            cursor: grab; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            transform: translateZ(0);
        }

        .arrow-marker {
            position: absolute; width: 0; height: 0;
            border-left: 7px solid transparent; border-right: 7px solid transparent;
            border-bottom: 11px solid var(--wheel-border);
            left: 50%; top: 2px; transform: translateX(-50%);
        }

        .ball {
            position: absolute; width: 28px; height: 28px;
            background-color: var(--ball-color);
            border-radius: 50%; z-index: 5;
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.4);
            top: 50%; left: 50%; margin-top: -14px; margin-left: -14px;
            will-change: transform;
        }

        /* --- LINKS MINIMALISTAS ORIGINAL --- */
        .menu { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        
        .card {
            background: var(--white); 
            padding: 18px 25px; 
            border-radius: 18px; 
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--text); 
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.2, 1, 0.3, 1);
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        
        .card-left { display: flex; align-items: center; gap: 14px; }
        .card-icon { width: 20px; height: 20px; fill: currentColor; }

        .card:active { transform: scale(0.97); background: #f9f9f9; }
        
        @media(hover: hover) {
            .card:hover {
                background: var(--text);
                color: var(--white);
                transform: scale(1.02);
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            }
        }

        footer { font-size: 0.7rem; color: #BBB; text-transform: uppercase; letter-spacing: 0.1em; }
        #sound-hint { position: absolute; opacity: 0; top: 120px; }

    </style>
</head>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');

        // AUDIO SYSTEM
        let audioCtx = null;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const hint = document.getElementById('sound-hint');
            hint.style.opacity = 1; setTimeout(() => hint.style.opacity = 0, 3000);
        }
        function playTick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.03);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.03);
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        }

        // PHYSICS ENGINE
        let wAngle = 0, isDrag = false, sAngle = 0, wVel = 0, lastTick = 0;
        let bX = 0, bY = 0, bVX = 0, bVY = 0;
        const GRAVITY = 0.45, FRICTION = 0.995, BOUNCE = 0.85;
        const LIMIT = 117; 

        function getA(x, y) {
            const r = wheel.getBoundingClientRect();
            return Math.atan2(y - (r.top + r.height/2), x - (r.left + r.width/2)) * 180 / Math.PI;
        }

        function start(e) {
            initAudio(); isDrag = true; wVel = 0;
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            sAngle = getA(cx, cy) - wAngle;
        }

        function move(e) {
            if (!isDrag) return;
            e.preventDefault();
            const cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            const a = getA(cx, cy);
            let d = (a - sAngle) - wAngle;
            if (d > 180) d -= 360; if (d < -180) d += 360;
            wVel = d; wAngle += d;
            wheel.style.transform = `rotate(${wAngle}deg)`;
            if (Math.abs(wAngle - lastTick) > 30) { playTick(); lastTick = wAngle; }
        }

        function end() { isDrag = false; }

        function loop() {
            if (!isDrag) {
                wVel *= 0.985; wAngle += wVel;
                wheel.style.transform = `rotate(${wAngle}deg)`;
                if (Math.abs(wAngle - lastTick) > 30 && Math.abs(wVel) > 0.5) { playTick(); lastTick = wAngle; }
            }
            bVY += GRAVITY; bX += bVX; bY += bVY;
            const d = Math.sqrt(bX*bX + bY*bY);
            if (d > LIMIT) {
                const nx = bX/d, ny = bY/d;
                bX = nx*LIMIT; bY = ny*LIMIT;
                const dot = bVX*nx + bVY*ny;
                bVX -= 2*dot*nx; bVY -= 2*dot*ny;
                bVX *= BOUNCE; bVY *= BOUNCE;
                const s = wVel * 1.2; 
                bVX += -ny*s; bVY += nx*s;
            }
            bVX *= FRICTION; bVY *= FRICTION;
            ball.style.transform = `translate3d(${bX}px, ${bY}px, 0)`;
            requestAnimationFrame(loop);
        }

        wheel.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        wheel.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', end);

        bY = -50; loop();
    </script>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eloi Silva | Visual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #EBEBEB;
            --black: #111111;
            --white: #FFFFFF;
            --accent: #0044FF; /* Azul Klein Industrial */
            --border: 2px solid #111;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            font-family: 'Space Grotesk', monospace; /* Fonte mais "Bruta" */
            color: var(--black);
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px;
            position: relative;
        }

        /* TEXTURA DE GRÃO (NOISE) PARA O LOOK "BRUTO" */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.05;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 0;
        }

        /* --- HEADER --- */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            border-bottom: 2px solid var(--black);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 0.9;
        }

        .meta {
            text-align: right;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .status-blink {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            margin-right: 4px;
            animation: blink 1s step-end infinite;
        }

        /* --- STAGE FÍSICO --- */
        .stage-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* O CONTAINER DA RODA */
        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
        }

        /* 1. A SOMBRA/BASE ESTÁTICA (SOLUÇÃO DO PROBLEMA) */
        /* Isto fica PARADO atrás da roda. Não gira. */
        .static-plate {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #d4d4d4;
            /* Sombra dura e técnica */
            box-shadow: 10px 10px 0px rgba(0,0,0,0.15); 
            z-index: 1;
        }

        /* 2. A RODA GIRATÓRIA (O MOTOR) */
        .spinning-wheel {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: var(--black);
            cursor: grab;
            z-index: 2;
            /* Detalhes visuais técnicos */
            border: 4px solid var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .spinning-wheel:active { cursor: grabbing; }

        /* Marcadores Industriais */
        .crosshair {
            position: absolute;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .crosshair::before {
            content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 20px; background: var(--white);
        }
        .crosshair::after {
            content: ''; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 20px; background: var(--white);
        }

        /* 3. A PISTA INTERNA */
        .inner-track {
            width: 200px;
            height: 200px;
            background: var(--bg); /* Cor do fundo para parecer vazado */
            border-radius: 50%;
            position: relative;
            /* Borda interna bruta */
            box-shadow: inset 0 0 0 4px rgba(0,0,0,0.1);
        }
        
        /* Texto técnico que gira com a roda */
        .tech-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--black);
            opacity: 0.4;
            pointer-events: none;
        }

        /* 4. A BOLA (ELEMENTO SOLTO) */
        .ball {
            position: absolute;
            width: 32px;
            height: 32px;
            background: var(--accent); /* Azul Elétrico */
            border: 2px solid var(--black); /* Outline preto */
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
            /* Centrada inicialmente via JS */
            top: 50%; left: 50%;
            margin-top: -16px; margin-left: -16px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        }

        /* --- LINKS --- */
        .links-grid {
            width: 100%;
            display: grid;
            gap: 10px;
            z-index: 10;
        }

        .btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: var(--white);
            border: 2px solid var(--black); /* Borda grossa */
            text-decoration: none;
            color: var(--black);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.1s ease;
            box-shadow: 4px 4px 0px rgba(0,0,0,1); /* Sombra Sólida "Bruta" */
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,1);
        }

        .btn-icon { width: 20px; height: 20px; }
        
        /* Estilo especial para o botão de ação principal */
        .btn.primary {
            background: var(--black);
            color: var(--white);
        }
        .btn.primary .btn-icon { fill: var(--white); }

        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            opacity: 0.5;
            pointer-events: none;
        }

        /* Keyframes */
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <script>
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');

        // Configuração
        let wheelAngle = 0;
        let isDragging = false;
        let startAngle = 0;
        let wheelVelocity = 0;
        
        let ballX = 0; 
        let ballY = 0; 
        let ballVX = 0; 
        let ballVY = 0; 
        
        const gravity = 0.5; 
        const friction = 0.99; 
        const bounce = 0.7; 
        
        // Dimensões (Hardcoded para performance, baseado no CSS)
        // Roda interna = 200px (Raio 100)
        // Bola = 32px (Raio 16)
        // Limite = 100 - 16 = 84px
        const boundary = 84; 

        // INPUT EVENTS
        function getAngle(x, y) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
        }

        function startDrag(e) {
            isDragging = true;
            wheelVelocity = 0;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startAngle = getAngle(clientX, clientY) - wheelAngle;
            wheel.style.cursor = 'grabbing';
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            const angle = getAngle(clientX, clientY);
            
            const newAngle = angle - startAngle;
            let delta = newAngle - wheelAngle;
            
            if (delta > 180) delta -= 360;
            if (delta < -180) delta += 360;

            wheelVelocity = delta;
            wheelAngle = newAngle;
            
            wheel.style.transform = `rotate(${wheelAngle}deg)`;
        }

        function stopDrag() {
            isDragging = false;
            wheel.style.cursor = 'grab';
        }

        // PHYSICS LOOP
        function updatePhysics() {
            // Roda inércia
            if (!isDragging) {
                wheelVelocity *= 0.96; 
                if (Math.abs(wheelVelocity) < 0.01) wheelVelocity = 0;
                wheelAngle += wheelVelocity;
                wheel.style.transform = `rotate(${wheelAngle}deg)`;
            }

            // Bola Gravidade
            ballVY += gravity;
            ballX += ballVX;
            ballY += ballVY;

            // Colisão
            const dist = Math.sqrt(ballX * ballX + ballY * ballY);

            if (dist > boundary) {
                const nx = ballX / dist;
                const ny = ballY / dist;

                ballX = nx * boundary;
                ballY = ny * boundary;

                const dot = ballVX * nx + ballVY * ny;
                
                ballVX -= 2 * dot * nx;
                ballVY -= 2 * dot * ny;

                ballVX *= bounce;
                ballVY *= bounce;

                // Transferência de momento angular
                // Se a roda gira para a direita (positivo), a força tangente empurra a bola
                const spinForce = wheelVelocity * 0.7; 
                ballVX += -ny * spinForce; 
                ballVY += nx * spinForce;
            }

            ballVX *= friction;
            ballVY *= friction;

            ball.style.transform = `translate3d(${ballX}px, ${ballY}px, 0)`;
            requestAnimationFrame(updatePhysics);
        }

        // Listeners
        wheel.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);
        wheel.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('touchmove', onDrag, {passive: false});
        window.addEventListener('touchend', stopDrag);

        // Start
        ballY = -40; // Começar a bola no topo
        updatePhysics();

    </script>

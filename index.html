<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eloi Silva | Fidget Balance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F2F2F4; --text: #000; --accent: #FF4500; --wheel: #000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
        html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; background: var(--bg); font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 20px; }

        header { text-align: center; width: 100%; pointer-events: none; }
        .buzz-text { font-size: 2.2rem; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 10px; color: var(--text); }
        
        .score-container {
            display: inline-flex; gap: 15px; background: #fff; padding: 10px 24px; 
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            font-weight: 900; font-size: 1rem; pointer-events: auto;
        }
        #current-score { color: var(--accent); min-width: 40px; display: inline-block; text-align: left; }

        .stage { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        
        .wheel-wrap { width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 2; will-change: transform; }
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; border: 12px solid var(--wheel);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        
        .bar {
            position: absolute; width: 90px; height: 16px; background: var(--wheel);
            top: 50%; left: 50%; margin-left: -45px; margin-top: -8px; border-radius: 8px;
        }

        .ball {
            position: absolute; width: 28px; height: 28px; background: var(--accent);
            border-radius: 50%; z-index: 5; pointer-events: none; will-change: transform;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); top: 50%; left: 50%; margin: -14px 0 0 -14px;
        }
        .ball.scoring { background: #FF2200; box-shadow: 0 0 20px rgba(255, 69, 0, 0.8); transition: box-shadow 0.2s; }

        .menu { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .card { 
            background: #fff; padding: 14px 20px; border-radius: 12px; 
            text-decoration: none; color: #000; font-weight: 600; 
            display: flex; justify-content: space-between; font-size: 0.9rem; 
            border: 1px solid rgba(0,0,0,0.03); transition: transform 0.1s, background 0.1s;
        }
        .card:active { transform: scale(0.96); background: #f0f0f0; }
        
        footer { font-size: 0.6rem; color: #bbb; letter-spacing: 0.1em; }
    </style>
</head>
<body>

    <header>
        <h1 class="buzz-text">ELOI SILVA</h1>
        <div class="score-container">
            <span>TIME: <span id="current-score">0.0</span>s</span>
            <span>BEST: <span id="high-score">0.0</span>s</span>
        </div>
    </header>

    <div class="stage" id="stage">
        <div class="wheel-wrap" id="wheel-wrap">
            <div class="wheel"></div>
            <div class="bar"></div>
        </div>
        <div class="ball" id="ball"></div>
    </div>

    <nav class="menu">
        <a href="https://www.instagram.com/aquele.eloi" target="_blank" class="card">Instagram <span>→</span></a>
        <a href="https://www.behance.net/eloi_silva" target="_blank" class="card">Behance <span>→</span></a>
        <a href="https://api.whatsapp.com/send/?phone=351913525033" target="_blank" class="card">WhatsApp <span>→</span></a>
    </nav>

    <footer>PORTUGAL 2026</footer>

    <script>
        const wheelWrap = document.getElementById('wheel-wrap');
        const ball = document.getElementById('ball');
        const scoreEl = document.getElementById('current-score');
        const highscoreEl = document.getElementById('high-score');
        const stage = document.getElementById('stage');

        let score = 0, highscore = 0;
        let isDrag = false, lastMouseAngle = 0;
        let wAngle = 0, wVel = 0;
        let bX = 0, bY = -100, bVX = 0, bVY = 0;

        // --- CONFIGURAÇÃO "FIDGET SPINNER" ---
        const WHEEL_FRICTION = 0.995; // Quase sem atrito (roda para sempre)
        const BALL_TRACTION = 0.85;   // Bola cola bem na barra

        const GRAVITY = 0.4;
        const FRICTION_AIR = 0.99;
        const BOUNCE_WALL = 0.4;
        
        const RADIUS = 138;
        const BALL_R = 14;
        const BAR_HW = 45; // Barra pequena
        const BAR_HH = 8;

        function getAngle(e) {
            const r = stage.getBoundingClientRect();
            const cx = r.left + r.width/2; 
            const cy = r.top + r.height/2;
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : 0)) - cx;
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : 0)) - cy;
            return Math.atan2(y, x);
        }

        function startDrag(e) { isDrag = true; lastMouseAngle = getAngle(e); wVel = 0; }
        function endDrag() { isDrag = false; }
        
        function moveDrag(e) {
            if(!isDrag) return;
            const a = getAngle(e);
            let d = a - lastMouseAngle;
            while(d > Math.PI) d -= Math.PI*2;
            while(d < -Math.PI) d += Math.PI*2;
            
            // Sensibilidade direta
            wVel = d * (180/Math.PI); 
            wAngle += wVel;
            lastMouseAngle = a;
        }

        stage.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', moveDrag);
        window.addEventListener('mouseup', endDrag);
        stage.addEventListener('touchstart', startDrag, {passive:false});
        window.addEventListener('touchmove', moveDrag, {passive:false});
        window.addEventListener('touchend', endDrag);

        function loop() {
            // 1. Física da Roda (Estilo Fidget Spinner)
            if(!isDrag) {
                wVel *= WHEEL_FRICTION; // Perde muito pouco impulso
                wAngle += wVel;
            }

            // 2. Física da Bola
            bVY += GRAVITY;
            bX += bVX; 
            bY += bVY;

            const rad = -wAngle * (Math.PI/180);
            const cos = Math.cos(rad); 
            const sin = Math.sin(rad);

            const lx = bX * cos - bY * sin;
            const ly = bX * sin + bY * cos;

            let onBar = false;

            // Colisão com a Barra
            if (lx > -BAR_HW - BALL_R && lx < BAR_HW + BALL_R && 
                ly > -(BAR_HH + BALL_R + 15) && ly < (BAR_HH + BALL_R)) {
                
                if(ly < 0) {
                    onBar = true;
                    
                    const targetLY = -(BAR_HH + BALL_R);
                    bX = lx * Math.cos(-rad) - targetLY * Math.sin(-rad);
                    bY = lx * Math.sin(-rad) + targetLY * Math.cos(-rad);

                    // A bola "sente" a rotação da roda
                    // Se a roda girar muito rápido, a bola é cuspida (Centrífuga)
                    const centrifugal = wVel * 0.08; 
                    const slope = Math.sin(wAngle * Math.PI/180);
                    
                    bVX += slope * 0.5;      // Deslize pela gravidade
                    bVX += centrifugal;      // Lançamento pela rotação
                    
                    bVY = 0;
                    
                    // Tração "Cola"
                    bVX *= BALL_TRACTION;
                    bVY *= BALL_TRACTION;
                }
            }

            // Colisão Paredes
            const dist = Math.sqrt(bX*bX + bY*bY);
            if(dist > RADIUS - BALL_R) {
                const nx = bX/dist, ny = bY/dist;
                bX = nx * (RADIUS - BALL_R);
                bY = ny * (RADIUS - BALL_R);
                const dot = bVX*nx + bVY*ny;
                bVX = (bVX - 2*dot*nx) * BOUNCE_WALL;
                bVY = (bVY - 2*dot*ny) * BOUNCE_WALL;
                
                // Spin nas paredes
                bVX += -ny * wVel * 0.1;
                bVY += nx * wVel * 0.1;
                
                onBar = false;
            }

            if(!onBar) {
                bVX *= FRICTION_AIR;
                bVY *= FRICTION_AIR;
            }

            // Pontuação
            if(onBar && Math.abs(lx) < BAR_HW) {
                score += 1/60; 
                ball.classList.add('scoring');
            } else {
                if(score > 0) {
                    if(score > highscore) highscore = score;
                    score = 0; 
                }
                ball.classList.remove('scoring');
            }

            wheelWrap.style.transform = `rotate(${wAngle}deg)`;
            ball.style.transform = `translate(${bX}px, ${bY}px)`;
            
            scoreEl.innerText = score.toFixed(2);
            highscoreEl.innerText = highscore.toFixed(2);

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>

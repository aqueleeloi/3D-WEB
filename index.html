    <style>
        :root {
            --bg: #F5F5F7;
            --text: #000000;
            --white: #FFFFFF;
            --wheel-color: #000000; /* Cor da borda e ticks */
            --ball-color: #FF4500;  /* Vermelho Alaranjado */
        }

        /* --- CONFIGURAÇÕES GERAIS (IOS FIXES) --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; outline: none;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            height: 100dvh; width: 100%; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 30px 20px;
        }

        /* HEADER */
        header { text-align: center; z-index: 10; pointer-events: none; }
        h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
        .badge {
            margin-top: 10px; display: inline-block; background: var(--white);
            border: 1px solid rgba(0,0,0,0.08); padding: 5px 15px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        #sound-hint {
            position: absolute; top: 80px; font-size: 0.6rem; color: #aaa; 
            opacity: 0; transition: opacity 1s; pointer-events: none; left: 50%; transform: translateX(-50%);
        }

        /* STAGE */
        .stage {
            position: relative; width: 280px; height: 280px;
            display: flex; align-items: center; justify-content: center;
            touch-action: none;
        }

        /* Sombra Fixa */
        .static-shadow {
            position: absolute; width: 90%; height: 90%; border-radius: 50%;
            background: transparent; box-shadow: 0 25px 50px rgba(0,0,0,0.12);
            z-index: 0; pointer-events: none;
        }

        /* --- NOVA RODA TRANSPARENTE BOLD --- */
        .wheel {
            position: relative;
            width: 100%; height: 100%;
            background-color: transparent; /* Fundo transparente */
            border-radius: 50%;
            /* Borda preta grossa (BOLD) */
            border: 6px solid var(--wheel-color);
            cursor: grab; z-index: 2;
            display: flex; align-items: center; justify-content: center;
            /* Transform para performance iOS */
            transform: translateZ(0);
        }
        .wheel:active { cursor: grabbing; }

        /* Ticks do Relógio (Gerados via JS) */
        .tick {
            position: absolute;
            background-color: var(--wheel-color);
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            pointer-events: none;
        }
        .tick.major { width: 3px; height: 12px; margin-left: -1.5px; }
        .tick.minor { width: 1px; height: 7px; margin-left: -0.5px; opacity: 0.7; }

        /* Área interna (onde a bola bate) */
        .hollow {
            width: 180px; height: 180px;
            background: transparent; /* Transparente também */
            border-radius: 50%;
            /* Sombra interna sutil para profundidade */
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(0,0,0,0.05);
            position: relative; pointer-events: none;
            z-index: 3;
        }
        
        /* --- BOLA VERMELHO ALARANJADO --- */
        .ball {
            position: absolute; width: 28px; height: 28px;
            /* Nova Cor */
            background-color: var(--ball-color);
            border-radius: 50%;
            z-index: 5;
            /* Sombra colorida sutil */
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.4);
            pointer-events: none;
            top: 50%; left: 50%; margin-top: -14px; margin-left: -14px;
            will-change: transform;
        }

        /* Links */
        .menu { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .card {
            background: var(--white); padding: 18px 25px; border-radius: 18px;
            display: flex; align-items: center; justify-content: space-between;
            text-decoration: none; color: var(--text); font-weight: 600;
            transition: transform 0.1s; border: 1px solid rgba(0,0,0,0.03);
            cursor: pointer;
        }
        .card-left { display: flex; align-items: center; gap: 12px; }
        .card-icon { width: 20px; height: 20px; fill: currentColor; }
        .card:active { transform: scale(0.96); background: #f0f0f0; }
        @media(hover: hover) {
            .card:hover { background: var(--text); color: var(--white); transform: scale(1.02); }
        }

        footer { font-size: 0.7rem; color: #999; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>

    <script>
        const wheel = document.getElementById('wheel');
        const hollow = document.querySelector('.hollow');
        const ball = document.getElementById('ball');

        // --- GERAR TICKS DO RELÓGIO ---
        function generateTicks() {
            const numTicks = 60; // 60 segundos
            const radius = 132; // Posicionar ligeiramente dentro da borda
            for (let i = 0; i < numTicks; i++) {
                const tick = document.createElement('div');
                const angle = (i / numTicks) * 360;
                // Ticks maiores a cada 5
                tick.className = (i % 5 === 0) ? 'tick major' : 'tick minor';
                // Posicionar radialmente
                tick.style.transform = `rotate(${angle}deg) translateY(-${radius}px)`;
                wheel.insertBefore(tick, hollow);
            }
        }
        generateTicks();

        // --- SISTEMA DE ÁUDIO (IOS HAPTICS) ---
        let audioCtx = null;
        let isAudioUnlocked = false;

        function initAudio() {
            if (isAudioUnlocked) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                audioCtx = new AudioContext();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
                isAudioUnlocked = true;
                const hint = document.getElementById('sound-hint');
                hint.style.opacity = 1;
                setTimeout(() => hint.style.opacity = 0, 3000);
            }
        }

        function playClickSound() {
            if (!audioCtx || audioCtx.state === 'suspended') { if(audioCtx) audioCtx.resume(); return;}
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.type = 'triangle'; osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        }

        // --- FÍSICA E LÓGICA ---
        let wheelAngle = 0, isDragging = false, startAngle = 0, wheelVelocity = 0;
        let lastTickAngle = 0;
        const tickInterval = 30; 

        let ballX = 0, ballY = 0, ballVX = 0, ballVY = 0;
        const gravity = 0.5, friction = 0.985, bounce = 0.65;
        const boundary = 76; 

        function getAngle(x, y) {
            const rect = wheel.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
        }

        function startDrag(e) {
            initAudio(); isDragging = true; wheelVelocity = 0;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            startAngle = getAngle(clientX, clientY) - wheelAngle;
            wheel.style.cursor = 'grabbing';
        }

        function handleTick(currentAngle) {
            if (Math.abs(currentAngle - lastTickAngle) > tickInterval) {
                playClickSound();
                if (navigator.vibrate) navigator.vibrate(5);
                lastTickAngle = currentAngle;
            }
        }

        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault(); 
            const clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            const angle = getAngle(clientX, clientY);
            let delta = (angle - startAngle) - wheelAngle;
            if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
            wheelVelocity = delta; wheelAngle += delta;
            wheel.style.transform = `rotate(${wheelAngle}deg)`;
            handleTick(wheelAngle);
        }

        function stopDrag() { isDragging = false; wheel.style.cursor = 'grab'; }

        function update() {
            if (!isDragging) {
                wheelVelocity *= 0.98; wheelAngle += wheelVelocity;
                wheel.style.transform = `rotate(${wheelAngle}deg)`;
                if (Math.abs(wheelVelocity) > 0.5) handleTick(wheelAngle); 
            }
            ballVY += gravity; ballX += ballVX; ballY += ballVY;
            const dist = Math.sqrt(ballX * ballX + ballY * ballY);
            if (dist > boundary) {
                const nx = ballX / dist, ny = ballY / dist;
                ballX = nx * boundary; ballY = ny * boundary;
                const dot = ballVX * nx + ballVY * ny;
                ballVX -= 2 * dot * nx; ballVY -= 2 * dot * ny;
                ballVX *= bounce; ballVY *= bounce;
                const spin = wheelVelocity * 0.8;
                ballVX += -ny * spin; ballVY += nx * spin;
            }
            ballVX *= friction; ballVY *= friction;
            ball.style.transform = `translate3d(${ballX}px, ${ballY}px, 0)`;
            requestAnimationFrame(update);
        }

        const passive = {passive: false};
        wheel.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);
        wheel.addEventListener('touchstart', startDrag, passive);
        window.addEventListener('touchmove', onDrag, passive);
        window.addEventListener('touchend', stopDrag);

        ballY = -30;
        update();
    </script>
